<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .b { fill:#0f172a; }
      .card { fill:#1e293b; stroke:#334155; stroke-width:1.5; }
      .white { fill:#f8fafc; }
      .muted { fill:#94a3b8; }
      .title { font-weight:700; font-size:13px; }
      .body  { font-size:11px; }
      .lbl   { font-size:10px; letter-spacing:1px; }
      .edge  { stroke:#94a3b8; stroke-width:1.5; fill:none; }
    </style>
  </defs>
  <rect width="1200" height="480" class="b"/>
  <text x="600" y="30" text-anchor="middle" class="white" font-size="18" font-weight="700">
    Auto-Investigate Pipeline Anatomy
  </text>
  <text x="600" y="52" text-anchor="middle" class="muted body">
    One click → six stages → verdict. Every stage emits an event to the investigation timeline.
  </text>

  <!-- 1. Input -->
  <g><rect x="30" y="90" width="160" height="80" rx="6" class="card"/>
    <text x="110" y="115" text-anchor="middle" class="lbl" fill="#7ee3c9">1 · INPUT</text>
    <text x="110" y="135" text-anchor="middle" class="white title">Raw payload</text>
    <text x="110" y="152" text-anchor="middle" class="muted body">command · blob · IOC</text></g>
  <!-- 2. Magic -->
  <g><rect x="220" y="90" width="160" height="80" rx="6" class="card"/>
    <text x="300" y="115" text-anchor="middle" class="lbl" fill="#f59e0b">2 · MAGIC</text>
    <text x="300" y="135" text-anchor="middle" class="white title">Auto-detect</text>
    <text x="300" y="152" text-anchor="middle" class="muted body">base64 · hex · rot · zlib</text></g>
  <!-- 3. Candidate -->
  <g><rect x="410" y="90" width="160" height="80" rx="6" class="card"/>
    <text x="490" y="115" text-anchor="middle" class="lbl" fill="#a78bfa">3 · CANDIDATE</text>
    <text x="490" y="135" text-anchor="middle" class="white title">Rank &amp; score</text>
    <text x="490" y="152" text-anchor="middle" class="muted body">alphabet · entropy · lang</text></g>
  <!-- 4. Chain -->
  <g><rect x="600" y="90" width="160" height="80" rx="6" class="card"/>
    <text x="680" y="115" text-anchor="middle" class="lbl" fill="#a78bfa">4 · CHAIN</text>
    <text x="680" y="135" text-anchor="middle" class="white title">Run stages</text>
    <text x="680" y="152" text-anchor="middle" class="muted body">recursive · stop rules</text></g>
  <!-- 5. Enrich -->
  <g><rect x="790" y="90" width="160" height="80" rx="6" class="card"/>
    <text x="870" y="115" text-anchor="middle" class="lbl" fill="#7ee3c9">5 · ENRICH</text>
    <text x="870" y="135" text-anchor="middle" class="white title">IOC lookup</text>
    <text x="870" y="152" text-anchor="middle" class="muted body">VT · OTX · AbuseIPDB</text></g>
  <!-- 6. Verdict -->
  <g><rect x="980" y="90" width="180" height="80" rx="6" class="card" stroke="#7ee3c9" stroke-width="2"/>
    <text x="1070" y="115" text-anchor="middle" class="lbl" fill="#f43f5e">6 · VERDICT</text>
    <text x="1070" y="135" text-anchor="middle" class="white title">Malicious · Suspicious</text>
    <text x="1070" y="152" text-anchor="middle" class="muted body">+ MITRE + confidence</text></g>

  <!-- Arrows between the 6 stages -->
  <line x1="190" y1="130" x2="220" y2="130" class="edge" marker-end="url(#a1)"/>
  <line x1="380" y1="130" x2="410" y2="130" class="edge" marker-end="url(#a1)"/>
  <line x1="570" y1="130" x2="600" y2="130" class="edge" marker-end="url(#a1)"/>
  <line x1="760" y1="130" x2="790" y2="130" class="edge" marker-end="url(#a1)"/>
  <line x1="950" y1="130" x2="980" y2="130" class="edge" marker-end="url(#a1)"/>

  <!-- Timeline banner -->
  <g><rect x="30" y="230" width="1130" height="60" rx="6" fill="#0b1220" stroke="#7ee3c9" stroke-width="1.2"/>
    <text x="595" y="255" text-anchor="middle" class="lbl" fill="#7ee3c9">EVENT BUS · every stage emits to `learning_events`</text>
    <text x="595" y="275" text-anchor="middle" class="body muted">Analyst corrections at any point close the loop → tomorrow's engine is smarter.</text></g>

  <!-- Downward loop arrows from each stage to the timeline -->
  <line x1="110" y1="170" x2="110" y2="230" class="edge" stroke-dasharray="3 3" marker-end="url(#a1)"/>
  <line x1="300" y1="170" x2="300" y2="230" class="edge" stroke-dasharray="3 3" marker-end="url(#a1)"/>
  <line x1="490" y1="170" x2="490" y2="230" class="edge" stroke-dasharray="3 3" marker-end="url(#a1)"/>
  <line x1="680" y1="170" x2="680" y2="230" class="edge" stroke-dasharray="3 3" marker-end="url(#a1)"/>
  <line x1="870" y1="170" x2="870" y2="230" class="edge" stroke-dasharray="3 3" marker-end="url(#a1)"/>
  <line x1="1070" y1="170" x2="1070" y2="230" class="edge" stroke-dasharray="3 3" marker-end="url(#a1)"/>

  <!-- Legend -->
  <g><rect x="30" y="330" width="1130" height="130" rx="6" fill="#0b1220" stroke="#334155"/>
    <text x="60" y="355" class="lbl" fill="#94a3b8">LEGEND</text>
    <circle cx="60" cy="380" r="6" fill="#7ee3c9"/><text x="76" y="384" class="body white">Input · Enrichment · Verdict — analyst-facing</text>
    <circle cx="60" cy="405" r="6" fill="#f59e0b"/><text x="76" y="409" class="body white">Magic — deterministic sniff (no LLM)</text>
    <circle cx="60" cy="430" r="6" fill="#a78bfa"/><text x="76" y="434" class="body white">Candidate + Chain — scoring &amp; recursion, LLM tie-breaker on close calls</text>
    <text x="580" y="380" class="body muted">Latency budget: p50 &lt; 400 ms · p95 &lt; 1.8 s (deterministic path)</text>
    <text x="580" y="405" class="body muted">Fallback: any stage failure yields a partial verdict + reason chip</text>
    <text x="580" y="430" class="body muted">Timeline event schema: {stage, took_ms, verdict, confidence, evidence[]}</text>
  </g>
</svg>
