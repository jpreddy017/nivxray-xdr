id: PS_ENCODEDCOMMAND_GZIP_REFLECTIVE_LOADER_002
title: Malicious — CMD → PS -EncodedCommand → gzip → reflective shellcode injector
provenance: >
  Real-world sample surfaced via SME production screenshot on
  2026-02-XX. Analyst reported the workspace showed BENIGN · 60 on
  this fully-decoded reflective PowerShell shellcode loader while
  the legacy engine correctly said Malicious 70. Introduced as the
  permanent regression for v1.5.2 reflective-injection Intent
  coverage (RWX VirtualAlloc, Delegate-invoked function pointer,
  Microsoft.Win32.UnsafeNativeMethods reflection). See RELEASES.md
  v1.5.2 and tests/test_v152_recipe_and_reflective_injection.py.

# Locked corpus entry — DO NOT EDIT WITHOUT A RELEASE NOTE.
# The Golden decoder chain shape MUST remain:
#
#   L0  CMD wrapper (%COMSPEC% start powershell -encodedcommand …)
#   L1  UTF-16LE-decoded PowerShell containing
#         $s = New-Object IO.MemoryStream(,[Convert]::FromBase64String("<gzip-b64>"));
#         IEX (New-Object IO.StreamReader(
#                 New-Object IO.Compression.GzipStream(
#                     $s, [IO.Compression.CompressionMode]::Decompress))).ReadToEnd();
#   L2  gzip-decompressed reflective-shellcode-loader PowerShell
#       (func_get_proc_address + VirtualAlloc + Marshal.Copy +
#        GetDelegateForFunctionPointer)
#
# If a future decoder change causes this sample to stop at fewer
# than 3 layers OR the reflective-injection intents stop firing on
# the recovered L2 payload, CI MUST fail.
input: |-
  %COMSPEC% /b /c start /b /min powershell -nop -w hidden -encodedcommand 

expected_verdict: malicious
must_fire_intents:
  - defense_evasion
must_not_fire:
  - credential_access
forbidden_words_in_verdict:
  - empire
  - cobalt strike
  - ransomware
  - campaign
must_admit_unknown: false
expected_confidence_band: high
expected_iocs: []
expected_mitre:
  - T1055        # Process Injection (reflective in-memory shellcode)
expected_behaviors: []
min_recommendations: 1
# v1.5.2 reflective-injection Intent assertions — human-readable
# documentation of the corpus contract. The runtime pytest at
# tests/test_v152_recipe_and_reflective_injection.py enforces the
# signature-level detail; this yaml enforces the corpus-level
# invariant that reflective PS shellcode loaders MUST verdict
# malicious via defense_evasion.
decoder_convergence:
  min_layers: 3
  required_transformations:
    - ps_encoded_command
    - ps_indirect_compression_stream
  forbidden_stop_reason_at_l1: no_transformation
  deterministic: true
reflective_injection_intents:
  must_include_signatures:
    - RWX shellcode allocation
    - Delegate-invoked function pointer
    - Reflective Win32 API resolution
notes: >
  This sample was the driver for v1.5.2. Prior to that release, the
  Investigation Brain returned BENIGN because defense_evasion had no
  signatures for RWX-VirtualAlloc, Marshal→GetDelegateForFunctionPointer,
  Microsoft.Win32.UnsafeNativeMethods reflection, or Marshal.Copy of
  a byte-array into an IntPtr. Adding those five HIGH-risk (T1055)
  signatures fires defense_evasion, which the verdict engine's
  `high_evasion` short-circuit maps to MALICIOUS. Every future PR
  that touches the defense_evasion rule MUST re-run this sample.
