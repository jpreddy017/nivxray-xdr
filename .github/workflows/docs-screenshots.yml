name: Docs Screenshots

on:
  # Manual trigger by the team (Actions tab → Run workflow), optionally
  # scoped to a single workflow id.
  workflow_dispatch:
    inputs:
      workflow_id:
        description: "Workflow id to capture (blank = --all)"
        required: false
        default: ""
  # Also run once whenever the team publishes a Release — team action too.
  release:
    types: [published]

concurrency:
  group: docs-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NIVXRAY_BASE_URL:       ${{ secrets.NIVXRAY_BASE_URL }}
      NIVXRAY_ADMIN_EMAIL:    ${{ secrets.NIVXRAY_ADMIN_EMAIL }}
      NIVXRAY_ADMIN_PASSWORD: ${{ secrets.NIVXRAY_ADMIN_PASSWORD }}
      NIVXRAY_WORKFLOW:       ${{ github.event.inputs.workflow_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so the auto-commit step can push cleanly
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Preflight — verify backend is reachable
        run: |
          curl -fsS -o /dev/null -w "backend HTTP %{http_code}\n" \
            "${NIVXRAY_BASE_URL}/api/docs/stats" \
            -H "Authorization: Bearer dummy" || true

      - name: Capture screenshots
        run: bash backend/scripts/run_docs_capture.sh

      - name: List captured artefacts
        run: |
          echo "Captured PNGs:"
          find backend/docs/screenshots -type f -name '*.png' | sort

      - name: Upload screenshots as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-screenshots
          path: backend/docs/screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Commit refreshed screenshots (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [[ -z "$(git status --porcelain backend/docs/screenshots)" ]]; then
            echo "No screenshot changes to commit."
            exit 0
          fi
          git config user.name  "nivxray-docs-bot"
          git config user.email "bot@nivxray.local"
          git add backend/docs/screenshots
          git commit -m "docs(screenshots): auto-refresh $(date -u +%Y-%m-%d)"
          git push
