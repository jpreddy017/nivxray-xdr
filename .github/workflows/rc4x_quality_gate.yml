name: RC4.x Quality Gate

on:
  pull_request:
    branches: [main, feature/rc2, feature/rc2.1b, feature/rc4, feature/rc4.5]
    paths:
      - 'backend/**'
      - '.github/workflows/rc4x_quality_gate.yml'
  push:
    branches: [main, feature/rc2, feature/rc2.1b, feature/rc4, feature/rc4.5,
               feature/rc2-alignment]
    paths:
      - 'backend/**'
      - '.github/workflows/rc4x_quality_gate.yml'

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The EDR plane persists evidence in MongoDB, and two of its gates are
    # a Mongo aggregation and a Mongo query (the activity facet and the
    # activity filter). Those cannot be proved in Python, so CI gets a
    # real database rather than a mock.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # CI runs deterministic decoder tests only — the LLM stack
          # (litellm + emergentintegrations) is required at runtime by
          # a couple of comparison scripts, but not by any test in the
          # RC2.3/RC4.x quality-gate scope. Filter both lines out to
          # avoid the pip resolver colliding on the private CDN wheel.
          grep -Ev "^(emergentintegrations|litellm)([=<>~ ]|$| @ )" \
            requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          pip install brotli zstandard

      # ─── RC2.3 baseline (still guarding chain-completeness regression) ───
      - name: Unit tests — RC2.3 baseline scope
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_rc22_xor8_lolbas_stix.py \
            tests/test_meterpreter_gzip_xor_stager.py \
            tests/test_engine_phase_a.py \
            tests/test_rc22_workspace_adapter.py \
            -q --no-header

      # ─── RC4.0 six-pattern decoder roadmap ───
      - name: Unit tests — RC4.0 decoder pack
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_b64_concat_reconstruct.py \
            -q --no-header

      # ─── RC4.2 semantic mini + trace ───
      # NOTE: `test_rc42_smart_decode_flows.py` and
      # `test_rc42_transformation_trace.py` are HTTP-integration tests that
      # `requests.post` against a running uvicorn on localhost:8001. The
      # quality-gate workflow does not start a backend (deliberately —
      # this gate covers deterministic unit-scope only). They run locally
      # via supervisor and against Preview/Prod; here we run only the
      # deterministic sibling `test_rc42_semantic_mini.py` which covers
      # the same code paths without a network dependency.
      - name: Unit tests — RC4.2 semantic evaluator
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_rc42_semantic_mini.py \
            -q --no-header

      # ─── RC4.3 PS normalizer + smart-decode integration ───
      # `test_rc43_smart_normalizer.py` is HTTP-integration (localhost:8001
      # requests.post) — excluded from CI for the same reason as the RC4.2
      # HTTP files above. `test_ps_normalizer.py` covers the deterministic
      # normalizer surface without a network dependency.
      - name: Unit tests — RC4.3 PS normalizer
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_ps_normalizer.py \
            -q --no-header

      # ─── RC4.4 CMD Runtime Reconstruction engine ───
      - name: Unit tests — RC4.4 CMD runtime reconstruction
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_cmd_runtime_reconstruct.py \
            -q --no-header

      # ─── RC4.5 PS Backtick + Alias normalizers ───
      - name: Unit tests — RC4.5 PS backtick + alias normalizers
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_ps_backtick_normalizer.py \
            tests/test_ps_alias_normalizer.py \
            -q --no-header

      # ─── RC4.5 · ReDoS perf guard for mitre_map (Cloudflare 524 hotfix) ───
      - name: Unit tests — RC4.5 mitre_map ReDoS perf regression
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_mitre_redos_perf.py \
            -q --no-header

      # ─── EDR plane · deterministic scope (tenant isolation, Windows
      # canonicalization + activity projection, response authority,
      # findings, trajectory, installer contracts) ───
      # `tests/edr` is NOT run wholesale: ten suites in that directory
      # authenticate against the running preview edge (`/api/auth/login`)
      # and are live-integration by design — they cannot pass on a GitHub
      # runner and are excluded by name, exactly as the RC4.2/RC4.3 HTTP
      # suites above are. Everything else in `tests/edr` is deterministic
      # and IS a release gate: without this step the official quality gate
      # stayed green while tenant isolation, Windows canonicalization,
      # response authorization or findings could regress.
      - name: Unit tests — EDR plane (deterministic scope)
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: nivxray_ci
        run: |
          # ~20 of these suites assert about the repository at its DEPLOYED
          # path (`/app/backend/...`, `/app/agents/...`). Pointing /app at
          # the checkout makes those assertions true on a runner, rather
          # than rewriting twenty test files inside a CI-only commit.
          sudo ln -sfn "$GITHUB_WORKSPACE" /app
          python -m pytest tests/edr \
            --ignore=tests/edr/test_iter107_p0_3_freshness_review.py \
            --ignore=tests/edr/test_iteration_82_activation.py \
            --ignore=tests/edr/test_p0_a2_adversarial_live.py \
            --ignore=tests/edr/test_p0_f10_live_api.py \
            --ignore=tests/edr/test_p0_f6_response_ui_backend.py \
            --ignore=tests/edr/test_p0_f7_live_api.py \
            --ignore=tests/edr/test_p0a_response_authority_live.py \
            --ignore=tests/edr/test_p0c_durable_findings_live.py \
            --ignore=tests/edr/test_p1_10_live_contract.py \
            --ignore=tests/edr/test_wave0_api_smoke.py \
            -q --no-header

      # ─── RC2.3 chain-completeness benchmark (release gate — kept) ───
      - name: RC2.3 chain-completeness benchmark
        working-directory: backend
        run: |
          # Fail if chain_complete drops below RC2.3 Stable baseline (77.4%)
          # or if any false-positive IOC is introduced.
          python -m tests.rc23_benchmark.ci_gate \
            --min-chain-pct 77.4 \
            --max-fp 0

      - name: Save benchmark output as artifact
        if: always()
        working-directory: backend
        run: |
          python -m tests.rc23_benchmark.run_benchmark \
            --json rc23_benchmark_result.json || true

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc23-benchmark-result
          path: backend/rc23_benchmark_result.json
          if-no-files-found: warn
