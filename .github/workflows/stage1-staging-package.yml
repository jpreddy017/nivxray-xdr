name: Stage1 staging package (no deployment)
on:
  push:
    branches: [engineering/stage1-staging-package]
    paths: [deploy/stage1-staging/**, .github/workflows/stage1-staging-package.yml]
  pull_request:
    paths: [deploy/stage1-staging/**, .github/workflows/stage1-staging-package.yml]
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python deploy/stage1-staging/prepare.py --verify-only
      - run: python -m unittest discover -s deploy/stage1-staging -p test_package.py -v
      - run: git diff --check ff66afe36efff3c0396b6e92ebaf21cae05d649a HEAD
  preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ff66afe36efff3c0396b6e92ebaf21cae05d649a
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -r backend/tests/command-automatic-requirements.txt
      - run: >-
          PYTHONPATH=backend python -m pytest -n 0
          backend/tests/test_xdr_analysis_ownership.py
          backend/tests/test_xdr_correlation_response_boundary.py
          backend/tests/test_mitre_catalogue_tenant_isolation.py
          backend/tests/test_command_resource_limits.py
          backend/tests/test_command_staging_contract.py
          backend/tests/test_rbac_selected_customer.py
          backend/tests/test_xdr_rc1_p1_scope_authority.py -q
        env:
          MONGO_URL: ''
      - run: npx --yes yarn@1.22.22 install --frozen-lockfile --non-interactive
        working-directory: apps/nivxray-xdr
      - run: npm test
        working-directory: apps/nivxray-xdr
      - run: bash scripts/vercel-build.sh
        working-directory: apps/nivxray-xdr
        env:
          CI: 'true'
          NIVX_PRODUCT_SCOPE: xdr
          XDR_PROD_API_ORIGIN: https://stage1-api.owner-staging.net
          XDR_GUARD_EXPECTED_API: https://stage1-api.owner-staging.net
          NIVX_CROSS_PRODUCT_ORIGINS: '0'
