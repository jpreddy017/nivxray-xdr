name: P0 Security Boundary

on:
  push:
    branches:
      - security/p0-boundary-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install fastapi==0.115.5 httpx==0.28.1 pydantic==2.13.4 pytest==9.1.1 pytest-asyncio==1.4.0 pytest-xdist bcrypt==4.1.3 PyJWT==2.13.0 pymongo==4.6.3 motor==3.3.1 python-dotenv==1.0.1 email-validator==2.3.0
      - run: pytest -q tests/test_xdr_response_gateway_security.py tests/test_xdr_response_evidence.py

  response-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nivxray-xdr-response
    env:
      XDR_RESPOND_ENV: test
      XDR_RESPOND_ALLOW_UNAUTHENTICATED_DEV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/

  collector-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nivxray-xdr-collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: pytest -q tests/
