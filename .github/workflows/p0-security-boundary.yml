name: P0 Security Boundary

on:
  push:
    branches:
      - security/p0-boundary-hardening
    paths-ignore:
      - P0_SECURITY_BOUNDARY_IMPLEMENTATION_REPORT.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install fastapi==0.115.5 httpx==0.28.1 pydantic==2.13.4 pytest==9.1.1 pytest-asyncio==1.4.0 pytest-xdist bcrypt==4.1.3 PyJWT==2.13.0 pymongo==4.6.3 motor==3.3.1 python-dotenv==1.0.1 email-validator==2.3.0
      - run: pytest -q tests/test_xdr_response_gateway_security.py tests/test_xdr_response_evidence.py tests/test_xdr_collector_gateway_security.py

  response-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nivxray-xdr-response
    env:
      XDR_RESPOND_ENV: test
      XDR_RESPOND_ALLOW_UNAUTHENTICATED_DEV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/

  collector-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nivxray-xdr-collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: pytest -q tests/

  backend-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install complete backend test dependencies
        run: |
          python -m pip install --upgrade pip
          grep -Ev "^(emergentintegrations|litellm)([=<>~ ]|$| @ )" requirements.txt > /tmp/p0-backend-requirements.txt
          pip install -r /tmp/p0-backend-requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          pip install pytest pytest-asyncio pytest-xdist pytest-timeout brotli zstandard
      - name: Run complete configured backend regression
        run: pytest -q --timeout=30
