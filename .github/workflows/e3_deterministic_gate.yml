name: E3 deterministic engines

on:
  pull_request:
    branches: [main, feature/e3-edr-engines, feature/rc2-alignment]
  push:
    branches: [feature/e3-edr-engines, 'engineering/e3-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 6
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: nivxray_e3_ci
      NIVX_AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic test dependencies
        run: >-
          python -m pip install
          pytest==9.1.1 pytest-xdist==3.8.0 pytest-asyncio==1.4.0
          fastapi==0.115.5 httpx==0.28.1
          motor==3.3.1 pymongo==4.6.3
      - name: Behavior, ML, causal investigation and trajectory contracts
        working-directory: backend
        # auto handles the existing unmarked async Mongo tests and fixtures.
        # The excluded suite requires a running authenticated preview backend;
        # it is a separate release validation, never a synthetic CI pass.
        run: |
          python -m pytest tests/edr_behavior tests/edr_ml \
            tests/edr_investigation tests/edr_trajectory \
            --ignore=tests/edr_trajectory/test_deeplink_http.py \
            --asyncio-mode=auto -q --no-header \
            --junitxml=e3-engine-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e3-engine-results
          path: backend/e3-engine-results.xml
          if-no-files-found: error
