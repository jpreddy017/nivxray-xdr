# TLS is terminated by a separately approved staging-only host ingress.
# Never expose backend:8001 or Mongo directly, including to the host.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 8080;
  server_name _;
  client_max_body_size 1m;
  merge_slashes on;
  # Fail closed on path tricks before proxying to any application route.
  if ($request_uri ~* "%|\\\\|\.\.") { return 403; }
  # Block the entire EDR/response plane and action/dispatch paths, not just UI.
  location ~* "(response|respond|execute|execution|dispatch|contain|isolate|quarantine|/edr(?:/|$)|/actions(?:/|$))" {
    return 403;
  }
  # No endpoint onboarding, telemetry admission or legacy decoder exposure.
  location ~* "(/collector(?:/|$)|/collectors(?:/|$)|/ingest(?:/|$)|/telemetry(?:/|$)|/webhooks?(?:/|$)|/v2/auto-investigate|/decoded-artifacts|/decode(?:/|$))" {
    return 403;
  }
  location /api/ {
    proxy_pass http://backend:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 3s;
    proxy_read_timeout 65s;
  }
  location / { return 404; }
}
