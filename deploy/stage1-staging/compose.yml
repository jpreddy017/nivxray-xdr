name: nivxray-stage1-staging
services:
  mongodb:
    image: ${MONGO_IMAGE:?Set reviewed mongo image with sha256 digest}
    env_file:
      - ${MONGO_ENV_FILE:?Absolute path outside repository}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/staging.js:ro
    networks: [private]
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    restart: "no"
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "const d=db.getSiblingDB(process.env.MONGO_INITDB_DATABASE); if(!d.auth(process.env.STAGING_MONGO_USER,process.env.STAGING_MONGO_PASSWORD)) quit(1); if(d.runCommand({ping:1}).ok!==1) quit(1);"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  backend:
    image: ${BACKEND_IMAGE:?Set verified Stage1 backend image with sha256 digest}
    env_file:
      - ${BACKEND_ENV_FILE:?Absolute path outside repository}
    environment:
      NIVX_DEPLOYMENT_ENV: production
      DB_NAME: nivxray_stage1_staging
      CORS_ORIGINS: ${STAGING_FRONTEND_ORIGIN:?Set isolated frontend HTTPS origin}
      NIVX_TENANT_REGISTRY_ENFORCE: "true"
      ADMIN_FORCE_PASSWORD_CHANGE: "true"
      AUTO_INVESTIGATE_V1: "off"
      NIVX_FILES_SWEEP_ENABLED: "0"
      XDR_RESPONSE_SERVICE_URL: ""
    networks: [private]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    init: true
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8001/api/health]
      interval: 20s
      timeout: 3s
      retries: 3
  gateway:
    image: ${NGINX_IMAGE:?Set reviewed nginx image with sha256 digest}
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:18081:8080"]
    networks: [private, ingress]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
networks:
  private:
    internal: true
  ingress: {}
volumes:
  mongo-data: {}
