# =============================================================
# NivXRay XDR · Docker Compose production floor (P0-F · Sprint 1)
#
# Owner-locked closure rule: this is the reproducible deployment
# baseline for V1 GA.  It stands up backend + frontend + Mongo
# with:
#   · non-root containers
#   · healthchecks + dependency ordering
#   · env-driven configuration (no hardcoded secrets)
#   · a named volume for Mongo persistence
#   · a Prometheus-friendly network so /api/metrics is scrapable
#
# Usage:
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#   curl http://localhost:8001/api/health
#   curl http://localhost:8001/api/metrics
#
# Verify config:
#   docker compose -f deploy/docker-compose.yml config
# =============================================================

x-log: &log-json
  driver: "json-file"
  options: { max-size: "10m", max-file: "3" }


services:

  mongodb:
    image: mongo:7
    container_name: nivxray-mongodb
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - nivxray-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *log-json
    networks: [nivxray]

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: nivxray/backend:${TAG:-1.0.0-rc}
    container_name: nivxray-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URL:  "mongodb://mongodb:27017"
      DB_NAME:    "${DB_NAME:-nivxray}"
      LOG_LEVEL:  "${LOG_LEVEL:-INFO}"
      OBSERVABILITY_METRICS_ENABLED: "1"
      ADMIN_EMAIL:    "${ADMIN_EMAIL:-admin@nivxray.com}"
      # ADMIN_PASSWORD MUST come from deploy/.env — never inline.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in deploy/.env}"
      ADMIN_FORCE_PASSWORD_CHANGE: "${ADMIN_FORCE_PASSWORD_CHANGE:-true}"
      EMERGENT_LLM_KEY: "${EMERGENT_LLM_KEY:-}"
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging: *log-json
    networks: [nivxray]

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        REACT_APP_BACKEND_URL: "${PUBLIC_BACKEND_URL:-http://localhost:8001}"
    image: nivxray/frontend:${TAG:-1.0.0-rc}
    container_name: nivxray-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *log-json
    networks: [nivxray]


volumes:
  nivxray-mongo-data:
    name: nivxray-mongo-data


networks:
  nivxray:
    name: nivxray
