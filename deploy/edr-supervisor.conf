; Install only in the verified backend deployment environment.
; Required supervisor environment:
; NIVX_RELEASE_ROOT, NIVX_RELEASE_PYTHON, NIVX_RELEASE_PORT, NIVX_RELEASE_LOG_DIR
; MONGO_URL, DB_NAME and existing authentication/application settings.
; Both programs MUST inherit the same database and immutable release directory.
[group:nivx-edr-release]
programs=nivx-edr-api,nivx-edr-file-index
priority=30

[program:nivx-edr-api]
directory=%(ENV_NIVX_RELEASE_ROOT)s/backend
command=%(ENV_NIVX_RELEASE_PYTHON)s -m uvicorn server:app --host 127.0.0.1 --port %(ENV_NIVX_RELEASE_PORT)s
environment=PYTHONPATH="%(ENV_NIVX_RELEASE_ROOT)s/backend",NIVX_EDR_PROCESSING_WORKERS="2",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=10
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=%(ENV_NIVX_RELEASE_LOG_DIR)s/api.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:nivx-edr-file-index]
directory=%(ENV_NIVX_RELEASE_ROOT)s/backend
command=%(ENV_NIVX_RELEASE_PYTHON)s scripts/edr_file_search_index.py --all-registered-tenants --follow
environment=PYTHONPATH="%(ENV_NIVX_RELEASE_ROOT)s/backend",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=10
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=%(ENV_NIVX_RELEASE_LOG_DIR)s/file-index.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
