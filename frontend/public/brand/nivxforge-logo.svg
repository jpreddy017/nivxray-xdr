<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" role="img" aria-label="NivXForge logo">
  <title>NivXForge — the security intelligence forge</title>
  <desc>NivXForge wordmark: hexagonal forge badge + typography, oxidized-copper with a molten-orange spark.</desc>

  <defs>
    <linearGradient id="fstroke2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#e2a05d"/>
      <stop offset="100%" stop-color="#e27e5d"/>
    </linearGradient>
    <linearGradient id="fhex2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#4aa890" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3b8b75" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="fglow2" cx="50%" cy="72%" r="45%">
      <stop offset="0%"  stop-color="#e27e5d" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#e27e5d" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#e27e5d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Mark (left, 360×360 badge inside a rounded frame) ───────── -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="360" height="360" rx="22" ry="22"
          fill="none" stroke="#2d3135" stroke-width="3"/>
    <circle cx="180" cy="252" r="130" fill="url(#fglow2)"/>

    <!-- Hexagon scaled to 300 unit inside 360 frame -->
    <polygon points="180,30 320,110 320,270 180,350 40,270 40,110"
             fill="none" stroke="url(#fhex2)" stroke-width="7" stroke-linejoin="miter"/>
    <polygon points="180,54 300,124 300,256 180,326 60,256 60,124"
             fill="none" stroke="#2d3135" stroke-width="2" stroke-linejoin="miter"/>

    <!-- Bracket-N inside -->
    <path d="M 92 252 L 92 108 L 132 108 L 210 210 L 210 108 L 265 108"
          fill="none" stroke="url(#fhex2)" stroke-width="18"
          stroke-linejoin="miter" stroke-linecap="square"/>

    <!-- Anvil plate + molten spark -->
    <rect x="126" y="268" width="108" height="6" fill="#2d3135"/>
    <circle cx="265" cy="252" r="18" fill="url(#fstroke2)"/>
    <circle cx="265" cy="252" r="26" fill="none" stroke="#e27e5d" stroke-opacity="0.35" stroke-width="2.5"/>
  </g>

  <!-- ── Wordmark (right) ────────────────────────────────────────── -->
  <g transform="translate(430,0)" font-family="'Chivo', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- NIVXFORGE — FORGE in molten orange -->
    <text x="0" y="240" font-weight="900" font-size="140" letter-spacing="4" fill="#e5e7eb">NIVX<tspan fill="#e27e5d">FORGE</tspan></text>

    <!-- Divider tick (orange for the parent brand) -->
    <rect x="4" y="268" width="90" height="3" fill="#e27e5d"/>

    <!-- Subtitle -->
    <text x="0" y="314" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace"
          font-size="26" letter-spacing="8" fill="#8b949e">SECURITY INTELLIGENCE FOUNDRY</text>
  </g>
</svg>
