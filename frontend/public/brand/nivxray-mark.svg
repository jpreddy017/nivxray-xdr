<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NivXRay mark">
  <title>NivXRay — mark</title>
  <desc>Asymmetric bracket-N with orange spark — NivXRay decoder / threat-lab logo.</desc>

  <!-- Optional soft radial for depth (kept subtle, transparent-friendly) -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#4aa890" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#4aa890" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#4aa890" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#5cc0a5"/>
      <stop offset="100%" stop-color="#3b8b75"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="8" y="8" width="496" height="496" rx="24" ry="24"
        fill="none" stroke="#2d3135" stroke-width="4"/>

  <!-- Ambient glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Bracket-N geometry (scaled from 32-unit source, 16x → 512) -->
  <!-- Original path: M6 24 L6 8 L11 8 L20 20 L20 8 L26 8   (stroke 2 in a 32-unit box) -->
  <!-- Scaled ×16 with centre offset: shifted +0 to keep symmetric bounds -->
  <path d="M 96 384 L 96 128 L 176 128 L 320 320 L 320 128 L 416 128"
        fill="none"
        stroke="url(#stroke)"
        stroke-width="32"
        stroke-linejoin="miter"
        stroke-linecap="square"/>

  <!-- Orange spark -->
  <circle cx="416" cy="384" r="32" fill="#e27e5d"/>
  <circle cx="416" cy="384" r="46" fill="none" stroke="#e27e5d" stroke-opacity="0.35" stroke-width="4"/>
</svg>
