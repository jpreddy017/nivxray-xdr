<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" role="img" aria-label="NivXRay logo">
  <title>NivXRay — Decoder / Threat-Lab</title>
  <desc>NivXRay wordmark: bracket-N mark + typography, oxidized-copper accent with an orange spark.</desc>

  <defs>
    <linearGradient id="mstroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#5cc0a5"/>
      <stop offset="100%" stop-color="#3b8b75"/>
    </linearGradient>
    <radialGradient id="mglow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#4aa890" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#4aa890" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#4aa890" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Mark (left, 360×360) ────────────────────────────────────── -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="360" height="360" rx="22" ry="22"
          fill="none" stroke="#2d3135" stroke-width="3"/>
    <circle cx="180" cy="180" r="140" fill="url(#mglow)"/>
    <path d="M 68 268 L 68 92 L 123 92 L 225 224 L 225 92 L 292 92"
          fill="none"
          stroke="url(#mstroke)"
          stroke-width="24"
          stroke-linejoin="miter"
          stroke-linecap="square"/>
    <circle cx="292" cy="268" r="22" fill="#e27e5d"/>
    <circle cx="292" cy="268" r="32" fill="none" stroke="#e27e5d" stroke-opacity="0.35" stroke-width="3"/>
  </g>

  <!-- ── Wordmark (right) — two lines only ───────────────────────── -->
  <g transform="translate(430,0)" font-family="'Chivo', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- NIVXRAY — RAY in accent -->
    <text x="0" y="240" font-weight="900" font-size="160" letter-spacing="6" fill="#e5e7eb">NIVX<tspan fill="#4aa890">RAY</tspan></text>

    <!-- Divider tick -->
    <rect x="4" y="268" width="80" height="3" fill="#4aa890"/>

    <!-- Subtitle -->
    <text x="0" y="314" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace"
          font-size="26" letter-spacing="10" fill="#8b949e">DECODER / THREAT-LAB</text>
  </g>
</svg>
